<script>
/* ===== HELPERS ===== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function rp(n){ return 'Rp ' + Math.round(n||0).toLocaleString('id-ID'); }
function fdate(d){ if(!d) return '-'; const p = d.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0].slice(2) : d; }
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function getOrderItems(o){
  if(Array.isArray(o.items) && o.items.length) return o.items;
  // Legacy: old format had single produkId at order level, no items array
  if(o.produkId && !o.items) return [{ id:'legacy', nama: '', jumlah:+o.jumlah||0 }];
  return [];
}
function getOrderTotalQty(o){
  return getOrderItems(o).reduce((s,it) => s + (+it.jumlah||0), 0);
}
function getOrderHarga(o){
  return +o.hargaSatuan || 0;
}
function getOrderProduk(o){
  return DATA.produk.find(p => p.id === o.produkId) || {};
}
function calcReceivedPerItem(order, itemId){
  return (order.penerimaan||[]).filter(r => r.itemId === itemId).reduce((s,r) => s + (+r.jumlah||0), 0);
}

function calcStatus(order){
  const totalPaid = (order.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
  const totalReceived = (order.penerimaan||[]).reduce((s,r) => s + (+r.jumlah||0), 0);
  const fullyPaid = totalPaid >= (+order.totalHarga||0);
  const fullyReceived = totalReceived >= getOrderTotalQty(order);
  if(fullyPaid && fullyReceived) return 'selesai';
  if(fullyPaid) return 'lunas';
  if(totalReceived > 0) return 'sebagian';
  if(totalPaid > 0) return 'dp';
  return 'pending';
}

function calcSisa(order){
  const totalPaid = (order.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
  return (+order.totalHarga||0) - totalPaid;
}

function calcReceived(order){
  return (order.penerimaan||[]).reduce((s,r) => s + (+r.jumlah||0), 0);
}

function calcTotalPaid(order){
  return (order.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
}

function statusBadge(s){
  const map = {
    pending: {cls:'badge-pending', label:'🟡 Pending'},
    dp: {cls:'badge-dp', label:'🔵 DP'},
    sebagian: {cls:'badge-sebagian', label:'🟠 Sebagian'},
    lunas: {cls:'badge-lunas', label:'🟢 Lunas'},
    selesai: {cls:'badge-selesai', label:'✅ Selesai'}
  };
  const m = map[s] || map.pending;
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

async function compressImage(file, maxWidth=300, quality=0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Gagal load image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Gagal baca file'));
    reader.readAsDataURL(file);
  });
}

/* ===== IMAGE DB (IndexedDB — no quota limit) ===== */
const IMG_DB_NAME = 'soldier_img_db';
const IMG_STORE = 'produk_img';
function openImgDB(){
  return new Promise((resolve,reject) => {
    const req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IMG_STORE);
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function saveImgsToDB(produkArr){
  try{
    const db = await openImgDB();
    const tx = db.transaction(IMG_STORE,'readwrite');
    const store = tx.objectStore(IMG_STORE);
    produkArr.forEach(p => { if(p.id && p.gambar) store.put(p.gambar, p.id); });
    await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
    db.close();
  }catch(e){ console.warn('saveImgsToDB',e); }
}
async function restoreImagesFromDB(){
  try{
    const db = await openImgDB();
    const tx = db.transaction(IMG_STORE,'readonly');
    const store = tx.objectStore(IMG_STORE);
    const map = await new Promise((resolve) => {
      const m = {};
      const cur = store.openCursor();
      cur.onsuccess = e => { const c = e.target.result; if(c){ m[c.key]=c.value; c.continue(); } else resolve(m); };
      cur.onerror = () => resolve({});
    });
    db.close();
    // Restore gambar to produk that have _hasImg flag
    let restored = 0;
    DATA.produk.forEach(p => {
      if(!p.gambar && p._hasImg && map[p.id]){ p.gambar = map[p.id]; restored++; }
      else if(!p.gambar && map[p.id]){ p.gambar = map[p.id]; restored++; }
    });
    if(restored) console.log('[Pembelian] Restored '+restored+' images from IndexedDB');
    return map;
  }catch(e){ console.warn('restoreImagesFromDB',e); return {}; }
}

/* ===== TOAST ===== */
function toast(msg, type='success'){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(40px)'; setTimeout(()=>t.remove(),300); }, 2500);
}

/* ===== DATA ===== */
const LS_KEY = 'soldier_pembelian_produk';
const FB_KEY = 'soldier_pembelian_produk_fb';
const FB_PATH = 'soldier/pembelianProduk';

function fbToArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return Object.keys(v).map(k => v[k]).filter(Boolean);
}

let DATA = { suppliers:[], produk:[], orders:[], pesananOffline:[] };
let pendingLocalChange = false;
let fbRef = null;
let fbDb = null;
let STOK_BAHAN = { pembelian:[], adjustment:[] }; // read-only from soldier/stokBahan

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) DATA = JSON.parse(raw);
  }catch(e){ console.warn('loadLocal error', e); }
  DATA.suppliers = fbToArr(DATA.suppliers);
  DATA.produk = fbToArr(DATA.produk);
  DATA.orders = fbToArr(DATA.orders);
  DATA.pesananOffline = fbToArr(DATA.pesananOffline);
  DATA.pesananOffline.forEach(po => {
    po.items = fbToArr(po.items);
    po.pembayaran = fbToArr(po.pembayaran);
  });
}

function saveLocal(){
  // Strip gambar from produk to avoid localStorage quota exceeded
  const clone = JSON.parse(JSON.stringify(DATA));
  clone.produk.forEach(p => {
    if(p.gambar){ p._hasImg = true; delete p.gambar; }
  });
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(clone));
  }catch(e){
    console.error('saveLocal error', e);
    // Emergency: strip more data
    clone.produk.forEach(p => delete p._hasImg);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(clone)); }catch(e2){ console.error('saveLocal critical', e2); }
  }
  // Save images to IndexedDB (async, non-blocking)
  saveImgsToDB(DATA.produk);
}

// Cleanup orphaned produksi entries for deleted offline orders
let _cleanupDone = {};
async function cleanupOrphanedProduksi(deletedIds){
  // Only run once per set of IDs
  const key = deletedIds.sort().join(',');
  if(_cleanupDone[key]) return;
  _cleanupDone[key] = true;
  if(!fbDb) return;
  try{
    const snap = await fbDb.ref('soldier/produksi/produksi').once('value');
    let arr = snap.val() || [];
    if(!Array.isArray(arr)) arr = Object.keys(arr).map(k => arr[k]).filter(Boolean);
    const before = arr.length;
    arr = arr.filter(p => !p._offlineOrderId || !deletedIds.includes(p._offlineOrderId));
    if(arr.length < before){
      await fbDb.ref('soldier/produksi/produksi').set(arr);
      console.log('[Pembelian] Cleaned up ' + (before - arr.length) + ' orphaned produksi entries');
    }
  }catch(e){ console.error('Cleanup produksi error', e); }
}

// Patch missing _offlineGambar to produksi entries (one-time migration)
let _patchGambarDone = false;
async function patchOfflineGambarToProduksi(){
  if(_patchGambarDone || !fbDb) return;
  _patchGambarDone = true;
  // Build lookup: offlineItemId → gambar
  const gambarMap = {};
  DATA.pesananOffline.forEach(po => {
    (po.items||[]).forEach(it => {
      if(it.id && it.gambar) gambarMap[it.id] = it.gambar;
    });
  });
  if(!Object.keys(gambarMap).length) return;
  try{
    const snap = await fbDb.ref('soldier/produksi/produksi').once('value');
    let arr = snap.val() || [];
    if(!Array.isArray(arr)) arr = Object.keys(arr).map(k => arr[k]).filter(Boolean);
    let patched = 0;
    arr.forEach(p => {
      if(p._offlineItemId && !p._offlineGambar && gambarMap[p._offlineItemId]){
        p._offlineGambar = gambarMap[p._offlineItemId];
        patched++;
      }
    });
    if(patched > 0){
      await fbDb.ref('soldier/produksi/produksi').set(arr);
      console.log('[Pembelian] Patched _offlineGambar to ' + patched + ' produksi entries');
    }
  }catch(e){ console.error('Patch gambar error', e); }
}

function save(){
  // Update all order statuses
  DATA.orders.forEach(o => {
    o.status = calcStatus(o);
    o.sisaBayar = calcSisa(o);
  });
  // Update pesanan offline totals + statuses
  DATA.pesananOffline.forEach(po => {
    po.hargaTotal = calcOfflineTotal(po);
    po.status = calcOfflineStatus(po);
  });
  saveLocal();
  pendingLocalChange = true;
  pushToFirebase(true); // immediate push, no debounce
  debouncedRender();
}

/* ===== FIREBASE ===== */
function getFbConfig(){
  try{ return JSON.parse(localStorage.getItem(FB_KEY) || 'null'); } catch(e){ return null; }
}

function saveFbConfig(cfg){
  localStorage.setItem(FB_KEY, JSON.stringify(cfg));
}

let firebaseLoaded = false;

async function initFirebase(){
  const cfg = getFbConfig();
  if(!cfg || !cfg.apiKey || !cfg.dbUrl) return;
  if(!firebaseLoaded){
    try{
      await loadScript('https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js');
      await loadScript('https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js');
      firebaseLoaded = true;
    }catch(e){ console.error('Firebase load error', e); return; }
  }
  try{
    if(!firebase.apps.length){
      firebase.initializeApp({ apiKey: cfg.apiKey, databaseURL: cfg.dbUrl, projectId: cfg.projectId || '' });
    }
    fbDb = firebase.database();
    fbRef = fbDb.ref(FB_PATH);
    let _firstFbLoad = true;
    fbRef.on('value', snap => {
      if(pendingLocalChange){ pendingLocalChange = false; return; }
      const val = snap.val();
      if(val){
        // On first load, check if local has MORE pesananOffline than Firebase (means push was lost)
        if(_firstFbLoad){
          _firstFbLoad = false;
          const fbOfflineCount = fbToArr(val.pesananOffline).filter(p => !p._deleted).length;
          const localOfflineCount = DATA.pesananOffline.filter(p => !p._deleted).length;
          if(localOfflineCount > fbOfflineCount){
            console.warn('[Pembelian] Local has more offline orders than Firebase, pushing local data');
            pushToFirebase(true);
            return;
          }
        }
        DATA.suppliers = fbToArr(val.suppliers);
        DATA.produk = fbToArr(val.produk);
        DATA.orders = fbToArr(val.orders);
        DATA.pesananOffline = fbToArr(val.pesananOffline);
        // Nested arrays inside pesananOffline items
        DATA.pesananOffline.forEach(po => {
          po.items = fbToArr(po.items);
          po.pembayaran = fbToArr(po.pembayaran);
        });
        // Remove tombstoned
        DATA.suppliers = DATA.suppliers.filter(s => !s._deleted);
        DATA.produk = DATA.produk.filter(p => !p._deleted);
        DATA.orders = DATA.orders.filter(o => !o._deleted);
        // Collect deleted offline order IDs before filtering
        const deletedOfflineIds = fbToArr(val.pesananOffline).filter(p => p._deleted && p.id).map(p => p.id);
        DATA.pesananOffline = DATA.pesananOffline.filter(p => !p._deleted);
        saveLocal();
        debouncedRender();
        // Cleanup: remove orphaned produksi entries for deleted offline orders
        if(deletedOfflineIds.length > 0) cleanupOrphanedProduksi(deletedOfflineIds);
        // Patch gambar ke produksi entries yang belum punya
        patchOfflineGambarToProduksi();
      }
    });
    // Listen stokBahan (read-only for cek stok)
    fbDb.ref('soldier/stokBahan').on('value', snap => {
      const val = snap.val();
      if(val){
        STOK_BAHAN.pembelian = val.pembelian || [];
        STOK_BAHAN.adjustment = val.adjustment || [];
        if(activeTab === 'offline') debouncedRender();
      }
    });
    toast('Firebase terhubung', 'success');
  }catch(e){ console.error('Firebase init error', e); toast('Firebase error: ' + e.message, 'error'); }
}

function loadScript(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[src="${src}"]`)){ res(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

let pushTimer = null;
function pushToFirebase(immediate){
  if(!fbRef) return;
  clearTimeout(pushTimer);
  if(immediate){
    pendingLocalChange = true;
    fbRef.set(DATA).then(() => {
      setTimeout(() => { pendingLocalChange = false; }, 2000);
    }).catch(e => console.error('Firebase push error', e));
  } else {
    pushTimer = setTimeout(() => {
      pendingLocalChange = true;
      fbRef.set(DATA).then(() => {
        setTimeout(() => { pendingLocalChange = false; }, 2000);
      }).catch(e => console.error('Firebase push error', e));
    }, 500);
  }
}

/* ===== RENDER ===== */
let renderTimer = null;
function debouncedRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderAll, 80);
}

function getSupplierForOrder(o){
  var prod = DATA.produk.find(function(p){ return p.id === o.produkId; }) || {};
  return DATA.suppliers.find(function(su){ return su.id === prod.supplierId; }) || {};
}

function groupOrdersBySupplierDate(orders){
  var groups = {};
  orders.forEach(function(o){
    var sup = getSupplierForOrder(o);
    var key = (sup.id||"none") + "|" + (o.tanggalOrder||"none");
    if(!groups[key]) groups[key] = { supplierId: sup.id||"none", supplier: sup, tanggalOrder: o.tanggalOrder||"", orders: [] };
    groups[key].orders.push(o);
  });
  return Object.values(groups);
}

function previewGabungan(){
  const selOrders = DATA.orders.filter(o => gabunganSelected.has(o.id));

  const jml = +document.getElementById('gb-jml').value || 0;

  let h = '<div style="font-weight:600;margin-bottom:4px;color:var(--text)">Distribusi pembayaran:</div>';
  selOrders.forEach(o => {

    const share = totalSisa > 0 ? Math.round(jml * sisa / totalSisa) : 0;
    h += '<div style="margin:2px 0">' + esc(prod.nama||'') + ' ' + esc(prod.model||'') + ' ' + esc(prod.warna||'') + ': <strong>' + rp(share) + '</strong> <span style="color:var(--muted)">(sisa ' + rp(sisa) + ')</span></div>';

function doBayarGabungan(){
  const selOrders = DATA.orders.filter(o => gabunganSelected.has(o.id));
  if(selOrders.length === 0){ toast('Tidak ada order dipilih', 'error'); return; }
  const jml = +document.getElementById('gb-jml').value || 0;
  if(jml <= 0){ toast('Jumlah harus > 0', 'error'); return; }
  const tgl = document.getElementById('gb-tgl').value || today();
  const ket = document.getElementById('gb-ket').value || '';
  const groupId = 'gbyr_' + uid();

  const totalSisa = selOrders.reduce((s,o) => s + Math.max(0, calcSisa(o)), 0);
  if(totalSisa <= 0){ toast('Semua order sudah lunas', 'error'); return; }

  // Distribute proportionally by remaining balance
  let distributed = 0;
  selOrders.forEach((o, idx) => {
    const sisa = Math.max(0, calcSisa(o));
    if(sisa <= 0) return;
    const share = (idx === selOrders.length - 1) ? (jml - distributed) : Math.round(jml * sisa / totalSisa);
    if(share <= 0) return;
    if(!o.pembayaran) o.pembayaran = [];
    o.pembayaran.push({
      id: 'pay_' + uid(),
      tanggal: tgl,
      jumlah: share,
      ket: (ket ? ket + ' ' : '') + '[Gabungan ' + selOrders.length + ' order]',
      groupId: groupId
    });
    distributed += share;
  });

  save();
  closeModal();
  gabunganMode = false;
  gabunganSelected.clear();
  toast('Pembayaran gabungan ' + rp(jml) + ' berhasil ke ' + selOrders.length + ' order', 'success');
}

function doGroupBayar(){
  var idsStr = document.getElementById('gp-ids').value;
  var ids = idsStr.split(',');
  var jml = +document.getElementById('gp-jml').value || 0;
  if(jml <= 0){ toast('Jumlah harus > 0', 'error'); return; }
  var tgl = document.getElementById('gp-tgl').value || today();
  var ket = document.getElementById('gp-ket').value || '';

  var orders = ids.map(function(id){ return DATA.orders.find(function(x){return x.id===id}); }).filter(Boolean);

  if(totalSisa <= 0){ toast('Semua order sudah lunas', 'info'); closeModal(); return; }
  var remaining = jml;
  orders.forEach(function(o, idx){
    var sisa = Math.max(0, calcSisa(o));
    if(sisa <= 0) return;
    var share;
    if(idx === orders.length - 1){
      share = remaining;
    } else {
      share = Math.round(jml * (sisa / totalSisa));
    }
    if(share <= 0) return;
    remaining -= share;
    if(!o.pembayaran) o.pembayaran = [];
    o.pembayaran.push({ id:'pay_'+uid(), tanggal:tgl, jumlah:share, ket: ket + ' [Grup]' });
  });
  save();
  closeModal();
  toast('Pembayaran grup berhasil \u2014 '+orders.length+' order', 'success');
}

/* ===== ORDER PNG GENERATOR ===== */
function generateOrderPNG(order){
  const produk = DATA.produk.find(p => p.id === order.produkId) || {};
  const supplier = DATA.suppliers.find(s => s.id === produk.supplierId) || {};
  const W = 600, PAD = 24, ROW = 26;
  const items = order.items || [];
  // Calculate height dynamically
  const H = 360 + items.length * ROW;
  const canvas = document.createElement('canvas');
  canvas.width = W * 2; canvas.height = H * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2); // retina
  // Colors
  const BG = '#1a1d23', PANEL = '#23272e', ACCENT = '#d4a529', WHITE = '#e8e8e8', MUTED = '#888', LINE = '#333';
  // Background
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  let y = 0;
  // Header
  ctx.fillStyle = PANEL; ctx.fillRect(0, 0, W, 64);
  ctx.fillStyle = ACCENT; ctx.fillRect(0, 62, W, 2);
  ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = ACCENT;
  ctx.fillText('SOLDIER APPAREL', PAD, 28);
  ctx.font = '12px sans-serif'; ctx.fillStyle = MUTED;
  ctx.fillText('ORDER CONFIRMATION', PAD, 48);
  ctx.fillStyle = WHITE; ctx.font = '11px sans-serif';
  ctx.textAlign = 'right'; ctx.fillText(order.tanggalOrder || '', W - PAD, 28);
  ctx.fillStyle = MUTED; ctx.font = '10px sans-serif';
  ctx.fillText(order.id || '', W - PAD, 48);
  ctx.textAlign = 'left';
  y = 76;
  // Supplier section
  ctx.fillStyle = ACCENT; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('SUPPLIER', PAD, y); y += 18;
  ctx.fillStyle = WHITE; ctx.font = '14px sans-serif';
  ctx.fillText(supplier.nama || '-', PAD, y); y += 18;
  ctx.fillStyle = MUTED; ctx.font = '12px sans-serif';
  const supDetail = [supplier.telp, supplier.kota].filter(Boolean).join(' · ');
  if(supDetail) ctx.fillText(supDetail, PAD, y);
  y += 24;
  // Line
  ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 16;
  // Product section
  ctx.fillStyle = ACCENT; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('PRODUK', PAD, y); y += 18;
  ctx.fillStyle = WHITE; ctx.font = '14px sans-serif';
  ctx.fillText(produk.nama || '-', PAD, y); y += 18;
  ctx.fillStyle = MUTED; ctx.font = '12px sans-serif';
  const prodDetail = [produk.kategori, produk.model].filter(Boolean).join(' · ');
  if(prodDetail) ctx.fillText(prodDetail, PAD, y);
  y += 6;
  ctx.textAlign = 'right'; ctx.fillStyle = WHITE; ctx.font = '12px sans-serif';
  ctx.fillText('Harga Satuan: Rp ' + fmtNum(order.hargaSatuan), W - PAD, y);
  ctx.textAlign = 'left';
  y += 24;
  // Line
  ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 16;
  // Variants table header
  ctx.fillStyle = ACCENT; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('VARIAN', PAD, y);
  ctx.textAlign = 'center'; ctx.fillText('QTY', 400, y);
  ctx.textAlign = 'right'; ctx.fillText('SUBTOTAL', W - PAD, y);
  ctx.textAlign = 'left';
  y += 14;
  ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 6;
  // Variant rows
  let totalQty = 0;
  items.forEach(it => {
    y += ROW - 6;
    const qty = +it.jumlah || 0;
    totalQty += qty;
    const sub = qty * (+order.hargaSatuan || 0);
    ctx.fillStyle = WHITE; ctx.font = '13px sans-serif';
    ctx.fillText(it.nama || '-', PAD + 4, y);
    ctx.textAlign = 'center'; ctx.fillText(qty.toLocaleString('id-ID'), 400, y);
    ctx.textAlign = 'right'; ctx.fillText('Rp ' + fmtNum(sub), W - PAD, y);
    ctx.textAlign = 'left';
  });
  y += 20;
  // Line
  ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 20;
  // Summary
  const summaryData = [
    ['Total (' + totalQty + ' pcs)', order.totalHarga, WHITE],
    ['DP', order.dp, '#4ecdc4'],
    ['Sisa Bayar', order.sisaBayar, order.sisaBayar > 0 ? '#ff6b6b' : '#4ecdc4']
  ];
  summaryData.forEach(([label, val, color]) => {
    ctx.fillStyle = MUTED; ctx.font = '12px sans-serif';
    ctx.fillText(label, PAD, y);
    ctx.fillStyle = color; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Rp ' + fmtNum(val || 0), W - PAD, y);
    ctx.textAlign = 'left';
    y += 24;
  });
  // Catatan
  if(order.catatan){
    y += 4;
    ctx.fillStyle = MUTED; ctx.font = '11px sans-serif';
    ctx.fillText('Catatan: ' + order.catatan, PAD, y);
    y += 16;
  }
  // Bottom accent line
  y += 8;
  ctx.fillStyle = ACCENT; ctx.fillRect(0, y, W, 2);
  // Trim canvas to actual content
  const finalH = y + 4;
  const trimmed = document.createElement('canvas');
  trimmed.width = W * 2; trimmed.height = finalH * 2;
  trimmed.getContext('2d').drawImage(canvas, 0, 0);
  return trimmed.toDataURL('image/png');
}

/* ===== COMBINED SUPPLIER ORDER PNG ===== */
function generateSupplierOrdersPNG(supplierId){
  const supplier = DATA.suppliers.find(s => s.id === supplierId) || {};
  const orders = DATA.orders.filter(o => {
    const p = DATA.produk.find(pr => pr.id === o.produkId);
    return p && p.supplierId === supplierId;
  });
  if(!orders.length) return null;

  const W = 600, PAD = 24, ROW = 26;
  // Calculate height: header(64) + supplier(60) + per order(product header 60 + variants + subtotal 30) + summary(90) + padding
  let estH = 200;
  orders.forEach(o => { estH += 90 + (o.items||[]).length * ROW + 40; });
  const canvas = document.createElement('canvas');
  canvas.width = W * 2; canvas.height = estH * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  const BG = '#1a1d23', PANEL = '#23272e', ACCENT = '#d4a529', WHITE = '#e8e8e8', MUTED = '#888', LINE = '#333';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, estH);
  let y = 0;
  // Header
  ctx.fillStyle = PANEL; ctx.fillRect(0, 0, W, 64);
  ctx.fillStyle = ACCENT; ctx.fillRect(0, 62, W, 2);
  ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = ACCENT;
  ctx.fillText('SOLDIER APPAREL', PAD, 28);
  ctx.font = '12px sans-serif'; ctx.fillStyle = MUTED;
  ctx.fillText('ORDER SUMMARY — ' + orders.length + ' PRODUK', PAD, 48);
  ctx.fillStyle = WHITE; ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  const today = new Date(); ctx.fillText(today.toISOString().split('T')[0], W - PAD, 28);
  ctx.textAlign = 'left';
  y = 76;
  // Supplier
  ctx.fillStyle = ACCENT; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('SUPPLIER', PAD, y); y += 18;
  ctx.fillStyle = WHITE; ctx.font = '14px sans-serif';
  ctx.fillText(supplier.nama || '-', PAD, y); y += 18;
  ctx.fillStyle = MUTED; ctx.font = '12px sans-serif';
  const supDet = [supplier.telp, supplier.kota].filter(Boolean).join(' \u00b7 ');
  if(supDet) ctx.fillText(supDet, PAD, y);
  y += 24;
  ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 8;

  let grandTotal = 0, grandDp = 0, grandSisa = 0, grandQty = 0;

  orders.forEach((order, idx) => {
    const produk = DATA.produk.find(p => p.id === order.produkId) || {};
    const items = order.items || [];
    y += 10;
    // Product header
    ctx.fillStyle = ACCENT; ctx.font = 'bold 12px sans-serif';
    ctx.fillText((idx+1) + '. ' + (produk.nama || '-'), PAD, y);
    ctx.textAlign = 'right'; ctx.fillStyle = WHITE; ctx.font = '12px sans-serif';
    ctx.fillText('@ Rp ' + fmtNum(order.hargaSatuan), W - PAD, y);
    ctx.textAlign = 'left'; y += 16;
    ctx.fillStyle = MUTED; ctx.font = '11px sans-serif';
    const pDet = [produk.kategori, produk.model].filter(Boolean).join(' \u00b7 ');
    if(pDet) ctx.fillText(pDet, PAD + 12, y);
    y += 16;
    // Variant rows
    let orderQty = 0;
    items.forEach(it => {
      const qty = +it.jumlah || 0;
      orderQty += qty;
      const sub = qty * (+order.hargaSatuan || 0);
      ctx.fillStyle = WHITE; ctx.font = '12px sans-serif';
      ctx.fillText(it.nama || '-', PAD + 16, y);
      ctx.textAlign = 'center'; ctx.fillText(qty.toLocaleString('id-ID'), 380, y);
      ctx.textAlign = 'right'; ctx.fillText('Rp ' + fmtNum(sub), W - PAD, y);
      ctx.textAlign = 'left';
      y += ROW - 4;
    });
    // Order subtotal line
    y += 4;
    ctx.fillStyle = MUTED; ctx.font = '11px sans-serif';
    ctx.fillText('Subtotal (' + orderQty + ' pcs)', PAD + 12, y);
    ctx.textAlign = 'right'; ctx.fillStyle = WHITE; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('Rp ' + fmtNum(order.totalHarga), W - PAD, y);
    ctx.textAlign = 'left';
    y += 8;
    // Pembayaran breakdown per order
    
    y += 10;
    ctx.strokeStyle = LINE; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
    ctx.setLineDash([]);
    grandTotal += (+order.totalHarga || 0);
    grandDp += calcTotalPaid(order);
    grandSisa += calcSisa(order);
    grandQty += orderQty;
  });

  y += 16;
  ctx.strokeStyle = ACCENT; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 20;
  // Grand summary
  const sumData = [
    ['GRAND TOTAL (' + grandQty + ' pcs)', grandTotal, WHITE],
    ['Total Dibayar', grandDp, '#4ecdc4'],
    ['Sisa Bayar', grandSisa, grandSisa > 0 ? '#ff6b6b' : '#4ecdc4']
  ];
  sumData.forEach(([label, val, color]) => {
    ctx.fillStyle = MUTED; ctx.font = '12px sans-serif';
    ctx.fillText(label, PAD, y);
    ctx.fillStyle = color; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Rp ' + fmtNum(val || 0), W - PAD, y);
    ctx.textAlign = 'left';
    y += 24;
  });
  y += 8;
  ctx.fillStyle = ACCENT; ctx.fillRect(0, y, W, 2);
  const finalH = y + 4;
  const trimmed = document.createElement('canvas');
  trimmed.width = W * 2; trimmed.height = finalH * 2;
  trimmed.getContext('2d').drawImage(canvas, 0, 0);
  return trimmed.toDataURL('image/png');
}

function showDownloadChoice(orderId){

  if(!order){ toast('Order tidak ditemukan','error'); return; }
  const produk = DATA.produk.find(p => p.id === order.produkId) || {};
  const supplier = DATA.suppliers.find(s => s.id === produk.supplierId) || {};
  // Count orders from same supplier
  const supOrders = DATA.orders.filter(o => {
    const p = DATA.produk.find(pr => pr.id === o.produkId);
    return p && p.supplierId === produk.supplierId;
  });

    return;

  const html = `

}

function downloadAllSupplierOrders(supplierId, supName){
  const imgSrc = generateSupplierOrdersPNG(supplierId);
  if(!imgSrc){ toast('Tidak ada order','error'); return; }
  const a = document.createElement('a');
  a.href = imgSrc;
  a.download = 'orders_' + (supName||'supplier').replace(/\s+/g,'_') + '.png';
  a.click();
  toast('PNG semua order downloaded!', 'success');
}



function saveOrder(){
  if(!orderFormState.produkId){ toast('Pilih produk terlebih dahulu', 'error'); return; }
  if(orderFormState.items.length === 0){ toast('Tambahkan minimal 1 varian', 'error'); return; }
  const harga = +orderFormState.hargaSatuan || 0;
  if(harga <= 0){ toast('Isi harga satuan', 'error'); return; }
  const totalQty = orderFormState.items.reduce((s,it) => s + (+it.jumlah||0), 0);
  const totalHarga = totalQty * harga;
  const dp = +document.getElementById('ob-dp').value || 0;
  const tanggalOrder = document.getElementById('ob-tanggal').value || today();

  const order = {
    id: 'ord_'+uid(),
    produkId: orderFormState.produkId,
    hargaSatuan: harga,
    items: orderFormState.items.map(it => ({...it})),
    tanggalOrder: tanggalOrder,
    totalHarga: totalHarga,
    dp: dp,
    tanggalDp: dp > 0 ? tanggalOrder : '',
    sisaBayar: totalHarga - dp,
    pembayaran: [],
    penerimaan: [],
    status: 'pending',
    catatan: document.getElementById('ob-catatan').value.trim()
  };

  if(dp > 0){
    order.pembayaran.push({ id:'pay_'+uid(), tanggal: tanggalOrder, jumlah: dp, ket:'DP awal' });
  }

  DATA.orders.push(order);
  save();

  // Show share modal with PNG
  showOrderShareModal(order);

  // Reset form
  orderFormState.produkId = '';
  orderFormState.hargaSatuan = '';
  orderFormState.items = [];
  orderFormState.newProdImg = '';
}

                    <div class="produk-name">${esc(p.nama)}</div>

function deleteSupplier(supId){

function saveFirebaseConfig(){
  const cfg = {
    apiKey: document.getElementById('st-apikey').value.trim(),
    dbUrl: document.getElementById('st-dburl').value.trim(),
    projectId: document.getElementById('st-projid').value.trim()
  };
  if(!cfg.apiKey || !cfg.dbUrl){ toast('API Key dan Database URL wajib diisi', 'error'); return; }
  saveFbConfig(cfg);
  // Reload firebase
  fbRef = null;
  fbDb = null;
  initFirebase();
  debouncedRender();
}

function nukeAndResync(){
  if(!confirm('Hapus cache lokal dan tarik ulang dari Firebase?')) return;
  // Clear local data but keep Firebase config
  DATA = { suppliers:[], produk:[], orders:[], pesananOffline:[] };
  saveLocal();
  // Force re-read from Firebase
  if(fbRef){
    pendingLocalChange = false;
    fbRef.once('value', snap => {
      const val = snap.val();
      if(val){
        DATA.suppliers = fbToArr(val.suppliers);
        DATA.produk = fbToArr(val.produk);
        DATA.orders = fbToArr(val.orders);
        DATA.pesananOffline = fbToArr(val.pesananOffline);
        DATA.pesananOffline.forEach(po => {
          po.items = fbToArr(po.items);
          po.pembayaran = fbToArr(po.pembayaran);
        });
        DATA.suppliers = DATA.suppliers.filter(s => !s._deleted);
        DATA.produk = DATA.produk.filter(p => !p._deleted);
        DATA.orders = DATA.orders.filter(o => !o._deleted);
        DATA.pesananOffline = DATA.pesananOffline.filter(p => !p._deleted);
        saveLocal();
        debouncedRender();
        toast('Data berhasil di-sync dari Firebase! ' + DATA.pesananOffline.length + ' pesanan offline ditemukan.', 'success');
      } else {
        toast('Firebase kosong — tidak ada data untuk di-sync', 'info');
      }
    });
  } else {
    toast('Firebase belum terhubung. Config dulu di Setting!', 'error');
  }
}

function resetData(){
  if(!confirm('Yakin reset semua data? Tindakan ini tidak dapat dibatalkan.')) return;
  if(!confirm('KONFIRMASI ULANG: Semua data supplier, produk, dan order akan dihapus.')) return;
  DATA = { suppliers:[], produk:[], orders:[], pesananOffline:[] };
  saveLocal();
  if(fbRef) fbRef.set(DATA);
  debouncedRender();
  toast('Data berhasil direset', 'info');
}

/* ===== STOK BAHAN HELPERS (read-only) ===== */
function normJenis(s){ return String(s||'').trim().toLowerCase(); }

function getStokBahanList(){
  const map = {};
  (STOK_BAHAN.pembelian||[]).forEach(p => {
    const k = normJenis(p.jenisBahan);
    if(!k) return;
    if(!map[k]) map[k] = { nama: p.jenisBahan, beli:0, adj:0 };
    map[k].beli += (+p.kg||0);
  });
  (STOK_BAHAN.adjustment||[]).forEach(a => {
    const k = normJenis(a.jenisBahan);
    if(!k) return;
    if(!map[k]) map[k] = { nama: a.jenisBahan, beli:0, adj:0 };
    map[k].adj += (+a.kg||0);
  });
  return Object.values(map).map(b => ({
    nama: b.nama,
    saldo: Math.round((b.beli + b.adj)*100)/100
  })).sort((a,b) => a.nama.localeCompare(b.nama));
}

/* ===== CDN LOADER ===== */
function loadCdn(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[src="${src}"]`)){ res(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

let offlineView = 'list';
let offlineSearch = '';
let offlinePage = 1;
let offlineFormState = { customer:'', kontak:'', alamat:'', items:[], deadline:'', catatan:'' };
let _offlineItemImg = '';
let _offlineSizeRows = [{ size:'', qty:'' }]; // multi-size input
let _offlineItemHarga = ''; // shared harga per model

function calcOfflineTotal(po){
  return (po.items||[]).reduce((s,it) => s + ((+it.qty||0)*(+it.harga||0)), 0);
}

function calcOfflineStatus(po){
  const totalHarga = calcOfflineTotal(po);
  const totalPaid = (po.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
  const totalItems = (po.items||[]).reduce((s,it) => s + (+it.qty||0), 0);
  const totalSelesai = (po.items||[]).reduce((s,it) => s + (+it.selesai||0), 0);
  if(totalPaid >= totalHarga && totalSelesai >= totalItems && totalItems > 0) return 'selesai';
  if(totalPaid >= totalHarga) return 'lunas';
  if(totalSelesai >= totalItems && totalItems > 0) return 'produksi_done';
  if(totalSelesai > 0) return 'produksi';
  if(totalPaid > 0) return 'dp';
  return 'pending';
}

function offlineStatusBadge(s){
  const map = {
    pending: {cls:'badge-pending', label:'🟡 Menunggu DP'},
    dp: {cls:'badge-dp', label:'🔵 DP Diterima'},
    produksi: {cls:'badge-sebagian', label:'🟠 Produksi'},
    produksi_done: {cls:'badge-lunas', label:'🧵 Produksi Selesai'},
    lunas: {cls:'badge-lunas', label:'🟢 Lunas'},
    selesai: {cls:'badge-selesai', label:'✅ Selesai'}
  };
  return `<span class="badge ${(map[s]||map.pending).cls}">${(map[s]||map.pending).label}</span>`;
}

function deadlineCountdown(dl){
  if(!dl) return '';
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dl); d.setHours(0,0,0,0);
  const diff = Math.ceil((d - now) / 86400000);
  if(diff < 0) return `<span style="color:var(--red);font-weight:600">⚠️ Terlambat ${Math.abs(diff)} hari</span>`;
  if(diff === 0) return `<span style="color:var(--orange);font-weight:600">⏰ Hari ini!</span>`;
  if(diff <= 7) return `<span style="color:var(--orange)">⏳ ${diff} hari lagi</span>`;
  return `<span style="color:var(--green)">📅 ${diff} hari lagi</span>`;
}

  }, 0);

async function handleOfflineItemImg(input){
  if(!input.files[0]) return;
  try{
    _offlineItemImg = await compressImage(input.files[0]);
    const area = document.getElementById('of-img-area');
    if(area){ const fi = area.querySelector('input[type=file]'); area.innerHTML = `<img src="${_offlineItemImg}" style="max-height:100px;border-radius:8px" alt="">`; area.appendChild(fi); }
  }catch(e){ toast('Gagal proses gambar', 'error'); }
}

function renderStokBahanPanel(){
  const bahanList = getStokBahanList();
  if(bahanList.length === 0) return `<div class="card"><div class="section-title">📦 Cek Stok Bahan</div><div style="font-size:12px;color:var(--muted)">Belum ada data stok bahan dari Firebase. Pastikan Stok Command sudah terhubung.</div></div>`;
  let rows = '';
  bahanList.forEach(b => {
    const color = b.saldo <= 0 ? 'var(--red)' : b.saldo < 5 ? 'var(--orange)' : 'var(--green)';
    const warn = b.saldo <= 0 ? '⚠️ Habis' : b.saldo < 5 ? '⚠️ Tipis' : '✅';
    rows += `<tr><td style="font-size:12px">${esc(b.nama)}</td><td style="text-align:right;font-weight:600;color:${color};font-size:12px">${b.saldo}</td><td style="font-size:11px">${warn}</td></tr>`;
  });
  return `<div class="card"><div class="section-title">📦 Cek Stok Bahan</div><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Data real-time dari Stok Command.</div><table><thead><tr><th>Jenis Bahan</th><th style="text-align:right">Saldo</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function addSizeRow(){
  _offlineSizeRows.push({ size:'', qty:'' });
  renderOffline();
}
function removeSizeRow(idx){
  _offlineSizeRows.splice(idx, 1);
  if(_offlineSizeRows.length === 0) _offlineSizeRows = [{ size:'', qty:'' }];
  renderOffline();
}

function addOfflineItem(){
  const nama = (document.getElementById('of-item-nama').value||'').trim();
  if(!nama){ toast('Isi nama barang', 'error'); return; }

  // Sync harga from DOM
  const hrgEl = document.getElementById('of-item-harga');
  if(hrgEl) _offlineItemHarga = hrgEl.value;
  const harga = +_offlineItemHarga || 0;
  if(harga <= 0){ toast('Harga satuan harus > 0', 'error'); return; }

  // Sync size rows from DOM
  _offlineSizeRows.forEach((row, i) => {
    const szEl = document.getElementById('of-sz-'+i);
    const qtyEl = document.getElementById('of-qty-'+i);
    if(szEl) row.size = szEl.value.trim();
    if(qtyEl) row.qty = qtyEl.value;
  });

  const validRows = _offlineSizeRows.filter(r => r.size && (+r.qty > 0));
  if(validRows.length === 0){ toast('Isi minimal 1 size dengan qty', 'error'); return; }
  const invalidRows = _offlineSizeRows.filter(r => r.size && !(+r.qty > 0));
  if(invalidRows.length > 0){ toast('Ada size yang qty-nya belum diisi', 'error'); return; }

  const img = _offlineItemImg || '';
  validRows.forEach(r => {
    offlineFormState.items.push({ id:'ofi_'+uid(), nama, size: r.size, qty: +r.qty, harga, selesai:0, gambar: img });
  });

  _offlineItemImg = '';
  _offlineItemHarga = '';
  _offlineSizeRows = [{ size:'', qty:'' }];
  renderOffline();
  toast(validRows.length+' size ('+validRows.map(r=>r.size).join(', ')+') ditambahkan — @'+rp(harga)+'/pcs', 'success');
}

function deleteOfflineGroup(nama){
  offlineFormState.items = offlineFormState.items.filter(it => it.nama !== nama);
  renderOffline();
  toast('Model "'+nama+'" dihapus', 'success');
}

function editOfflineGroup(nama){
  const groupItems = offlineFormState.items.filter(it => it.nama === nama);
  if(groupItems.length === 0) return;
  // Load group data into form inputs
  _offlineItemImg = groupItems[0].gambar || '';
  _offlineItemHarga = String(groupItems[0].harga || '');
  _offlineSizeRows = groupItems.map(it => ({ size: it.size, qty: String(it.qty) }));
  // Remove old items from list
  offlineFormState.items = offlineFormState.items.filter(it => it.nama !== nama);
  // Re-render — form will show pre-filled data, user edits and clicks "Tambah Semua Size" to re-add
  renderOffline();
  // Set nama field after render
  setTimeout(() => {
    const el = document.getElementById('of-item-nama');
    if(el) el.value = nama;
  }, 50);
  toast('Edit "'+nama+'" — ubah lalu klik "Tambah Semua Size"', 'info');
}

function saveOfflineOrder(){
  const customer = (document.getElementById('of-customer').value||'').trim();
  if(!customer){ toast('Nama customer wajib diisi', 'error'); return; }
  if(offlineFormState.items.length === 0){ toast('Tambahkan minimal 1 item', 'error'); return; }
  const grandTotal = offlineFormState.items.reduce((s,it) => s + ((+it.qty||0)*(+it.harga||0)), 0);
  if(grandTotal <= 0){ toast('Total harga harus > 0', 'error'); return; }
  const dp = +document.getElementById('of-dp').value || 0;
  const deadline = document.getElementById('of-deadline').value || '';
  const tanggal = document.getElementById('of-tanggal').value || today();
  const catatan = (document.getElementById('of-catatan').value||'').trim();

  const po = {
    id: 'po_'+uid(), customer, kontak: (document.getElementById('of-kontak').value||'').trim(),
    alamat: (document.getElementById('of-alamat').value||'').trim(),
    items: offlineFormState.items.map(it => ({...it})),
    hargaTotal: grandTotal, deadline, tanggalOrder: tanggal, catatan, pembayaran: [], status: 'pending'
  };
  if(dp > 0) po.pembayaran.push({ id:'pay_'+uid(), tanggal, jumlah: dp, ket:'DP awal' });

  DATA.pesananOffline.push(po);
  save();
  offlineFormState = { customer:'', kontak:'', alamat:'', items:[], deadline:'', catatan:'' };
  offlineView = 'list';
  toast('Pesanan offline berhasil disimpan!', 'success');
  renderOffline();
}

function doAddProduksi(poId, itemIdx){
  const po = DATA.pesananOffline.find(x => x.id === poId);
  if(!po || !po.items[itemIdx]) return;
  const add = +document.getElementById('oprod-add-'+itemIdx).value || 0;
  if(add <= 0){ toast('Jumlah harus > 0', 'error'); return; }
  const it = po.items[itemIdx];
  it.selesai = Math.min((+it.selesai||0) + add, +it.qty);
  save(); toast(`${it.nama}: ${it.selesai}/${it.qty} selesai`, 'success'); showOfflineProduksi(poId);
}

async function deleteOffline(poId){
  if(!confirm('Yakin hapus pesanan offline ini? Data di produksi juga akan dihapus.')) return;
  const po = DATA.pesananOffline.find(x => x.id === poId);
  if(!po) return;

  // Cascade delete: hapus entries dari soldier/produksi/produksi yang terkait order ini
  if(fbDb){
    try{
      const snap = await fbDb.ref('soldier/produksi/produksi').once('value');
      let produksiArr = snap.val() || [];
      if(!Array.isArray(produksiArr)){
        produksiArr = Object.keys(produksiArr).map(k => produksiArr[k]).filter(Boolean);
      }
      const before = produksiArr.length;
      produksiArr = produksiArr.filter(p => p._offlineOrderId !== poId);
      if(produksiArr.length < before){
        await fbDb.ref('soldier/produksi/produksi').set(produksiArr);
      }
    }catch(e){ console.error('Cascade delete produksi error', e); }
  }

  po._deleted = true;
  save(); closeModal(); toast('Pesanan offline & data produksi dihapus', 'success');
}

/* ===== KIRIM KE PRODUKSI (integrasi soldier/produksi) ===== */
async function kirimKeProduksi(poId){
  const po = DATA.pesananOffline.find(x => x.id === poId);
  if(!po) return;
  if(!fbDb){ toast('Firebase belum terhubung. Hubungkan di Setting.', 'error'); return; }

  const items = (po.items||[]).filter(it => !it.produksiId);
  if(items.length === 0){ toast('Semua item sudah dikirim ke produksi', 'info'); return; }

  const seriesName = 'OFFLINE-' + po.customer.toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,20);

  if(!confirm('Kirim '+items.length+' item ke Produksi?\n\nSeries: '+seriesName+'\nItems akan muncul di Laporan Produksi, Potong, Jahit, dan QC Command.\n\nLanjutkan?')) return;

  toast('Mengirim ke produksi...', 'info');

  try{
    // Read current produksi data
    const snap = await fbDb.ref('soldier/produksi/produksi').once('value');
    let produksiArr = snap.val() || [];
    // Convert Firebase object to array if needed
    if(!Array.isArray(produksiArr)){
      produksiArr = Object.values(produksiArr).filter(x => x != null);
    }

    // Create produksi entries for each offline item
    const newEntries = [];
    items.forEach(it => {
      const entry = {
        id: 'off_'+uid()+Math.random().toString(36).slice(2,4),
        series: seriesName,
        namaBarang: it.nama,
        size: it.size || 'All Size',
        poAktif: true,
        potong: [],
        bigSaller: [],
        bayarJahit: [],
        gudang: [],
        jahit: [],
        assignJahit: [],
        qc: [],
        _offlineOrderId: po.id,
        _offlineItemId: it.id,
        _offlineCustomer: po.customer,
        _offlineQty: it.qty,
        _offlineDeadline: po.deadline || '',
        _offlineGambar: it.gambar || ''
      };
      newEntries.push(entry);
      // Save produksiId back to the offline item
      it.produksiId = entry.id;
    });

    // Append and push
    produksiArr = produksiArr.concat(newEntries);
    await fbDb.ref('soldier/produksi/produksi').set(produksiArr);

    // Save offline data with produksiId references
    save();
    toast('✅ '+newEntries.length+' item berhasil dikirim ke Produksi! Cek Laporan Produksi.', 'success');
    renderOffline();
  }catch(e){
    console.error('Kirim ke produksi error:', e);
    toast('Gagal kirim ke produksi: '+e.message, 'error');
  }
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+tab));
  debouncedRender();
}

document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});
