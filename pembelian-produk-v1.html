
<!DOCTYPE html>

<style>

header{display:flex;align-items:center;gap:12px;padding:16px 0 8px;flex-wrap:wrap}

<body>
<div class="container">
  <header>
    <a href="index.html" class="back-btn">← Kembali</a>
    <h1><span>Pembelian Produk</span> Command</h1>
  </header>
  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">📊 Dashboard</button>
    <button class="tab-btn" data-tab="order-baru">➕ Order Baru</button>
    <button class="tab-btn" data-tab="produk">📦 Produk</button>
    <button class="tab-btn" data-tab="setting">⚙️ Setting</button>
    <button class="tab-btn" data-tab="offline">📋 Pesanan Offline</button>
  </div>
  <div id="tab-dashboard" class="tab-content active"></div>
  <div id="tab-order-baru" class="tab-content"></div>
  <div id="tab-produk" class="tab-content"></div>
  <div id="tab-setting" class="tab-content"></div>
  <div id="tab-offline" class="tab-content"></div>
</div>
<div id="modal-root"></div>
<div class="toast-container" id="toast-container"></div>

<script>
/* ===== HELPERS ===== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function rp(n){ return 'Rp ' + Math.round(n||0).toLocaleString('id-ID'); }
function fdate(d){ if(!d) return '-'; const p = d.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0].slice(2) : d; }
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function getOrderItems(o){
  if(Array.isArray(o.items) && o.items.length) return o.items;
  // Legacy: old format had single produkId at order level, no items array
  if(o.produkId && !o.items) return [{ id:'legacy', nama: '', jumlah:+o.jumlah||0 }];
  return [];
}
function getOrderTotalQty(o){
  return getOrderItems(o).reduce((s,it) => s + (+it.jumlah||0), 0);
}
function getOrderHarga(o){
  return +o.hargaSatuan || 0;
}
function getOrderProduk(o){
  return DATA.produk.find(p => p.id === o.produkId) || {};
}
function calcReceivedPerItem(order, itemId){
  return (order.penerimaan||[]).filter(r => r.itemId === itemId).reduce((s,r) => s + (+r.jumlah||0), 0);
}

function calcStatus(order){
  const totalPaid = (order.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
  const totalReceived = (order.penerimaan||[]).reduce((s,r) => s + (+r.jumlah||0), 0);
  const fullyPaid = totalPaid >= (+order.totalHarga||0);
  const fullyReceived = totalReceived >= getOrderTotalQty(order);
  if(fullyPaid && fullyReceived) return 'selesai';
  if(fullyPaid) return 'lunas';
  if(totalReceived > 0) return 'sebagian';
  if(totalPaid > 0) return 'dp';
  return 'pending';
}

function calcSisa(order){
  const totalPaid = (order.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
  return (+order.totalHarga||0) - totalPaid;
}

function calcReceived(order){
  return (order.penerimaan||[]).reduce((s,r) => s + (+r.jumlah||0), 0);
}

function calcTotalPaid(order){
  return (order.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
}

function statusBadge(s){
  const map = {
    pending: {cls:'badge-pending', label:'🟡 Pending'},
    dp: {cls:'badge-dp', label:'🔵 DP'},
    sebagian: {cls:'badge-sebagian', label:'🟠 Sebagian'},
    lunas: {cls:'badge-lunas', label:'🟢 Lunas'},
    selesai: {cls:'badge-selesai', label:'✅ Selesai'}
  };
  const m = map[s] || map.pending;
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

async function compressImage(file, maxWidth=400, quality=0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Gagal load image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Gagal baca file'));
    reader.readAsDataURL(file);
  });
}

/* ===== TOAST ===== */
function toast(msg, type='success'){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(40px)'; setTimeout(()=>t.remove(),300); }, 2500);
}

/* ===== DATA ===== */
const LS_KEY = 'soldier_pembelian_produk';
const FB_KEY = 'soldier_pembelian_produk_fb';
const FB_PATH = 'soldier/pembelianProduk';

let DATA = { suppliers:[], produk:[], orders:[], pesananOffline:[] };
let pendingLocalChange = false;
let fbRef = null;
let fbDb = null;
let STOK_BAHAN = { pembelian:[], adjustment:[] }; // read-only from soldier/stokBahan

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) DATA = JSON.parse(raw);
  }catch(e){ console.warn('loadLocal error', e); }
  if(!DATA.suppliers) DATA.suppliers = [];
  if(!DATA.produk) DATA.produk = [];
  if(!DATA.orders) DATA.orders = [];
  if(!DATA.pesananOffline) DATA.pesananOffline = [];
}

function saveLocal(){
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
}

// Cleanup orphaned produksi entries for deleted offline orders
let _cleanupDone = {};
async function cleanupOrphanedProduksi(deletedIds){
  // Only run once per set of IDs
  const key = deletedIds.sort().join(',');
  if(_cleanupDone[key]) return;
  _cleanupDone[key] = true;
  if(!fbDb) return;
  try{
    const snap = await fbDb.ref('soldier/produksi/produksi').once('value');
    let arr = snap.val() || [];
    if(!Array.isArray(arr)) arr = Object.keys(arr).map(k => arr[k]).filter(Boolean);
    const before = arr.length;
    arr = arr.filter(p => !p._offlineOrderId || !deletedIds.includes(p._offlineOrderId));
    if(arr.length < before){
      await fbDb.ref('soldier/produksi/produksi').set(arr);
      console.log('[Pembelian] Cleaned up ' + (before - arr.length) + ' orphaned produksi entries');
    }
  }catch(e){ console.error('Cleanup produksi error', e); }
}

function save(){
  // Update all order statuses
  DATA.orders.forEach(o => {
    o.status = calcStatus(o);
    o.sisaBayar = calcSisa(o);
  });
  // Update pesanan offline totals + statuses
  DATA.pesananOffline.forEach(po => {
    po.hargaTotal = calcOfflineTotal(po);
    po.status = calcOfflineStatus(po);
  });
  saveLocal();
  pendingLocalChange = true;
  pushToFirebase(true); // immediate push, no debounce
  debouncedRender();
}

/* ===== FIREBASE ===== */
function getFbConfig(){
  try{ return JSON.parse(localStorage.getItem(FB_KEY) || 'null'); } catch(e){ return null; }
}

function saveFbConfig(cfg){
  localStorage.setItem(FB_KEY, JSON.stringify(cfg));
}

let firebaseLoaded = false;

async function initFirebase(){
  const cfg = getFbConfig();
  if(!cfg || !cfg.apiKey || !cfg.dbUrl) return;
  if(!firebaseLoaded){
    try{
      await loadScript('https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js');
      await loadScript('https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js');
      firebaseLoaded = true;
    }catch(e){ console.error('Firebase load error', e); return; }
  }
  try{
    if(!firebase.apps.length){
      firebase.initializeApp({ apiKey: cfg.apiKey, databaseURL: cfg.dbUrl, projectId: cfg.projectId || '' });
    }
    fbDb = firebase.database();
    fbRef = fbDb.ref(FB_PATH);
    let _firstFbLoad = true;
    fbRef.on('value', snap => {
      if(pendingLocalChange){ pendingLocalChange = false; return; }
      const val = snap.val();
      if(val){
        // On first load, check if local has MORE pesananOffline than Firebase (means push was lost)
        if(_firstFbLoad){
          _firstFbLoad = false;
          const fbOfflineCount = (val.pesananOffline||[]).filter(p => !p._deleted).length;
          const localOfflineCount = DATA.pesananOffline.filter(p => !p._deleted).length;
          if(localOfflineCount > fbOfflineCount){
            // Local has data that Firebase doesn't — push local to Firebase
            console.warn('[Pembelian] Local has more offline orders than Firebase, pushing local data');
            pushToFirebase(true);
            return;
          }
        }
        DATA.suppliers = val.suppliers || [];
        DATA.produk = val.produk || [];
        DATA.orders = val.orders || [];
        DATA.pesananOffline = val.pesananOffline || [];
        // Remove tombstoned
        DATA.suppliers = DATA.suppliers.filter(s => !s._deleted);
        DATA.produk = DATA.produk.filter(p => !p._deleted);
        DATA.orders = DATA.orders.filter(o => !o._deleted);
        // Collect deleted offline order IDs before filtering
        const deletedOfflineIds = (val.pesananOffline||[]).filter(p => p._deleted && p.id).map(p => p.id);
        DATA.pesananOffline = DATA.pesananOffline.filter(p => !p._deleted);
        saveLocal();
        debouncedRender();
        // Cleanup: remove orphaned produksi entries for deleted offline orders
        if(deletedOfflineIds.length > 0) cleanupOrphanedProduksi(deletedOfflineIds);
      }
    });
    // Listen stokBahan (read-only for cek stok)
    fbDb.ref('soldier/stokBahan').on('value', snap => {
      const val = snap.val();
      if(val){
        STOK_BAHAN.pembelian = val.pembelian || [];
        STOK_BAHAN.adjustment = val.adjustment || [];
        if(activeTab === 'offline') debouncedRender();
      }
    });
    toast('Firebase terhubung', 'success');
  }catch(e){ console.error('Firebase init error', e); toast('Firebase error: ' + e.message, 'error'); }
}

function loadScript(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[src="${src}"]`)){ res(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

let pushTimer = null;
function pushToFirebase(immediate){
  if(!fbRef) return;
  clearTimeout(pushTimer);
  if(immediate){
    pendingLocalChange = true;
    fbRef.set(DATA).then(() => {
      setTimeout(() => { pendingLocalChange = false; }, 2000);
    }).catch(e => console.error('Firebase push error', e));
  } else {
    pushTimer = setTimeout(() => {
      pendingLocalChange = true;
      fbRef.set(DATA).then(() => {
        setTimeout(() => { pendingLocalChange = false; }, 2000);
      }).catch(e => console.error('Firebase push error', e));
    }, 500);
  }
}

/* ===== RENDER ===== */
let renderTimer = null;
function debouncedRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderAll, 80);
}

let activeTab = 'dashboard';
let dashPage = 1;
const PAGE_SIZE = 30;

function renderAll(){
  if(activeTab === 'dashboard') renderDashboard();
  else if(activeTab === 'order-baru') renderOrderBaru();
  else if(activeTab === 'produk') renderProduk();
  else if(activeTab === 'setting') renderSetting();
  else if(activeTab === 'offline') renderOffline();
}

/* ===== DASHBOARD ===== */
function renderDashboard(){
  const el = document.getElementById('tab-dashboard');
  const orders = DATA.orders.filter(o => !o._deleted);
  const activeOrders = orders.filter(o => o.status !== 'selesai');
  const totalBelumBayar = orders.reduce((s,o) => s + Math.max(0, calcSisa(o)), 0);
  const totalDiterima = orders.reduce((s,o) => s + calcReceived(o), 0);
  const totalBelumDiterima = orders.reduce((s,o) => s + Math.max(0, getOrderTotalQty(o) - calcReceived(o)), 0);

  const sorted = [...orders].sort((a,b) => (b.tanggalOrder||'').localeCompare(a.tanggalOrder||''));
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  if(dashPage > totalPages) dashPage = totalPages;
  const paged = sorted.slice((dashPage-1)*PAGE_SIZE, dashPage*PAGE_SIZE);

  let html = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-val" style="color:var(--blue)">${activeOrders.length}</div><div class="kpi-label">Order Aktif</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--red)">${rp(totalBelumBayar)}</div><div class="kpi-label">Belum Bayar</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--green)">${totalDiterima.toLocaleString('id-ID')}</div><div class="kpi-label">Sudah Diterima</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--orange)">${totalBelumDiterima.toLocaleString('id-ID')}</div><div class="kpi-label">Belum Diterima</div></div>
    </div>`;

  if(paged.length === 0){
    html += `<div class="empty-state"><div class="icon">📦</div><p>Belum ada order. Buat order baru di tab "Order Baru".</p></div>`;
  } else {
    paged.forEach(o => {
      const items = getOrderItems(o);
      const prod = getOrderProduk(o);
      const sup = DATA.suppliers.find(s => s.id === prod.supplierId) || {};
      const received = calcReceived(o);
      const totalQty = getOrderTotalQty(o);
      const paid = calcTotalPaid(o);
      const total = +o.totalHarga||0;
      const pct = total > 0 ? Math.min(100, Math.round(paid/total*100)) : 0;
      const status = calcStatus(o);
      const thumbHtml = prod.gambar
        ? `<div class="order-thumb"><img src="${prod.gambar}" alt=""></div>`
        : `<div class="order-thumb">📦</div>`;
      let titleText = esc(prod.nama||'Produk') + ' ' + esc(prod.model||'') + ' ' + esc(prod.warna||'');
      if(items.length > 1) titleText += ` <span style="color:var(--muted);font-weight:400">(${items.length} varian)</span>`;

      html += `
        <div class="card">
          <div class="order-card">
            ${thumbHtml}
            <div class="order-info">
              <div class="order-title">${titleText}</div>
              ${items.length > 0 ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${items.map(it => esc(it.nama||'—')+' ('+it.jumlah+')').join(', ')}</div>` : ''}
              <div class="order-sub">${esc(sup.nama||'Supplier')} &middot; ${fdate(o.tanggalOrder)} &middot; @ ${rp(getOrderHarga(o))}</div>
              <div class="order-meta">
                ${statusBadge(status)}
                <span>${received}/${totalQty} diterima</span>
              </div>
              <div style="margin-top:6px;font-size:12px;color:var(--muted)">${rp(paid)} / ${rp(total)} dibayar</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${pct>=100?'var(--green)':'var(--blue)'}"></div></div>
              <div class="btn-group">
                <button class="btn btn-sm btn-outline" onclick="showOrderDetail('${o.id}')">Detail</button>
                <button class="btn btn-sm btn-blue" onclick="showQuickBayar('${o.id}')">Bayar</button>
                <button class="btn btn-sm btn-green" onclick="showQuickTerima('${o.id}')">Terima</button>
                <button class="btn btn-sm btn-outline" onclick="showEditOrder('${o.id}')">✏️ Edit</button>
                <button class="btn btn-sm btn-red" onclick="deleteOrder('${o.id}')">🗑️</button>
              </div>
            </div>
          </div>
        </div>`;
    });
  }

  if(totalPages > 1){
    html += `<div class="pagination">`;
    html += `<button ${dashPage<=1?'disabled':''} onclick="dashPage--;debouncedRender()">‹</button>`;
    for(let i=1;i<=totalPages;i++){
      html += `<button class="${i===dashPage?'active':''}" onclick="dashPage=${i};debouncedRender()">${i}</button>`;
    }
    html += `<button ${dashPage>=totalPages?'disabled':''} onclick="dashPage++;debouncedRender()">›</button>`;
    html += `</div>`;
  }

  el.innerHTML = html;
}

  const received = calcReceived(o);
  const totalQty = getOrderTotalQty(o);

  items.forEach(it => {
    const rcvd = calcReceivedPerItem(o, it.id);

    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">

          <div style="font-size:13px;color:var(--muted)">Supplier: ${esc(sup.nama||'-')} &middot; ${esc(sup.kontak||'')} &middot; ${fdate(o.tanggalOrder)}</div>
          <div style="font-size:13px;color:var(--accent);margin-top:4px">Harga Satuan: ${rp(harga)}</div>
        </div>

        <h3>Varian Pesanan</h3>

          <thead><tr><th>Varian</th><th>Qty</th><th>Subtotal</th><th>Diterima</th></tr></thead>
          <tbody>${itemsTableRows}</tbody>
        </table>
        <div style="text-align:right;font-size:14px;font-weight:700;color:var(--accent);margin-top:6px">Grand Total: ${totalQty} pcs × ${rp(harga)} = ${rp(o.totalHarga)}</div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0">
          <div class="kpi"><div class="kpi-val" style="font-size:16px">${totalQty}</div><div class="kpi-label">Total Qty</div></div>
          <div class="kpi"><div class="kpi-val" style="font-size:16px">${rp(o.totalHarga)}</div><div class="kpi-label">Total Harga</div></div>
          <div class="kpi"><div class="kpi-val" style="font-size:16px">${statusBadge(status)}</div><div class="kpi-label">Status</div></div>

  document.getElementById('modal-root').innerHTML = html;

function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

function toggleInlineForm(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('hidden');
}

function addPayment(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  const tgl = document.getElementById('pf-tgl-'+orderId).value || today();
  const jml = +document.getElementById('pf-jml-'+orderId).value || 0;
  const ket = document.getElementById('pf-ket-'+orderId).value || '';
  if(jml <= 0){ toast('Jumlah harus > 0', 'error'); return; }
  if(!o.pembayaran) o.pembayaran = [];
  o.pembayaran.push({ id: 'pay_'+uid(), tanggal: tgl, jumlah: jml, ket: ket });
  save();
  toast('Pembayaran ditambahkan', 'success');
  showOrderDetail(orderId);
}

function addReceipt(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  const itemEl = document.getElementById('rf-item-'+orderId);
  const itemId = itemEl ? itemEl.value : 'legacy';
  const tgl = document.getElementById('rf-tgl-'+orderId).value || today();
  const jml = +document.getElementById('rf-jml-'+orderId).value || 0;
  const kon = document.getElementById('rf-kon-'+orderId).value || 'ok';
  const ket = document.getElementById('rf-ket-'+orderId).value || '';
  if(jml <= 0){ toast('Jumlah harus > 0', 'error'); return; }
  if(!o.penerimaan) o.penerimaan = [];
  o.penerimaan.push({ id: 'rcv_'+uid(), tanggal: tgl, itemId: itemId, jumlah: jml, kondisi: kon, ket: ket });
  save();
  toast('Penerimaan barang dicatat', 'success');
  showOrderDetail(orderId);
}

          <div class="form-group" style="flex:1;margin:0"><label>Qty</label><input type="number" id="eo-add-qty" placeholder="50"></div>
          <button class="btn btn-sm btn-primary" onclick="addEditOrderItem('${o.id}')" style="height:38px">+</button>
        </div>

        <div class="form-group" style="margin-top:14px"><label>Catatan</label><textarea id="eo-catatan">${esc(o.catatan||'')}</textarea></div>

        <div class="btn-group" style="margin-top:14px">
          <button class="btn btn-primary" onclick="doEditOrder('${o.id}')" style="flex:1">Simpan Perubahan</button>
          <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        </div>
      </div>

  document.getElementById('modal-root').innerHTML = html;

function renderEditOrderModalUpdate(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  const allProds = DATA.produk.filter(p => !p._deleted);
  let prodOpts = allProds.map(p => `<option value="${p.id}" ${p.id===(document.getElementById('eo-produk')?.value||o.produkId)?'selected':''}>${esc(p.nama)} ${esc(p.model||'')} ${esc(p.warna||'')}</option>`).join('');
  // Save current field values before re-render
  const savedHarga = document.getElementById('eo-harga')?.value;
  const savedTgl = document.getElementById('eo-tanggal')?.value;
  const savedCat = document.getElementById('eo-catatan')?.value;
  const savedProd = document.getElementById('eo-produk')?.value;
  const tempO = {...o, hargaSatuan: +savedHarga||o.hargaSatuan, tanggalOrder: savedTgl||o.tanggalOrder, catatan: savedCat||o.catatan, produkId: savedProd||o.produkId};

function addEditOrderItem(orderId){
  const nama = (document.getElementById('eo-add-nama').value||'').trim();
  const qty = +document.getElementById('eo-add-qty').value || 0;
  if(!nama){ toast('Isi nama varian','error'); return; }
  if(qty <= 0){ toast('Qty harus > 0','error'); return; }
  _editOrderItems.push({ id:'itm_'+uid(), nama, jumlah:qty });
  renderEditOrderModalUpdate(orderId);
  toast('Varian ditambahkan','success');
}

function doEditOrder(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  const produkId = document.getElementById('eo-produk').value;
  const harga = +document.getElementById('eo-harga').value || 0;
  const tanggal = document.getElementById('eo-tanggal').value || o.tanggalOrder;
  const catatan = document.getElementById('eo-catatan').value.trim();

  if(!produkId){ toast('Pilih produk','error'); return; }
  if(harga <= 0){ toast('Harga satuan harus > 0','error'); return; }
  if(_editOrderItems.length === 0){ toast('Minimal 1 varian','error'); return; }

  o.produkId = produkId;
  o.hargaSatuan = harga;
  o.items = _editOrderItems.map(it => ({...it}));
  o.tanggalOrder = tanggal;
  o.catatan = catatan;
  const totalQty = o.items.reduce((s,it) => s + (+it.jumlah||0), 0);
  o.totalHarga = totalQty * harga;
  o.sisaBayar = o.totalHarga - calcTotalPaid(o);

  save();
  closeModal();
  toast('Order diperbarui','success');
}

function deleteOrder(orderId){
  if(!confirm('Yakin hapus order ini?')) return;
  const o = DATA.orders.find(x => x.id === orderId);
  if(o) o._deleted = true;
  save();
  toast('Order dihapus','success');
}

function updateGrandTotal(){
  const harga = +orderFormState.hargaSatuan || 0;
  const totalQty = orderFormState.items.reduce((s,it) => s + (+it.jumlah||0), 0);
  const grandTotal = totalQty * harga;
  const gtEl = document.getElementById('ob-grand-total');
  if(gtEl) gtEl.textContent = totalQty + ' pcs × ' + rp(harga) + ' = ' + rp(grandTotal);
  const totalEl = document.getElementById('ob-total');
  if(totalEl) totalEl.value = rp(grandTotal);
}

function addOrderItem(){
  const nama = (document.getElementById('ai-nama').value||'').trim();

    nama: nama,

  });
  document.getElementById('ai-nama').value = '';
  document.getElementById('ai-qty').value = '';
  debouncedRender();
  toast('Varian ditambahkan', 'success');
}

function removeOrderItem(idx){
  orderFormState.items.splice(idx, 1);

async function handleNewProdImg(input){

function saveNewSupplier(){
  const nama = document.getElementById('ns-nama').value.trim();
  if(!nama){ toast('Nama supplier wajib diisi', 'error'); return; }
  const sup = {
    id: 'sup_'+uid(),
    nama: nama,
    kontak: document.getElementById('ns-kontak').value.trim(),

  };

function saveNewProduct(){
  const nama = document.getElementById('np-nama').value.trim();
  if(!nama){ toast('Nama produk wajib diisi', 'error'); return; }
  const prod = {
    id: 'prod_'+uid(),
    supplierId: orderFormState.supplierId,
    nama: nama,
    kategori: document.getElementById('np-kategori').value.trim(),
    model: document.getElementById('np-model').value.trim(),
    warna: document.getElementById('np-warna').value.trim(),
    gambar: orderFormState.newProdImg || '',
    catatan: document.getElementById('np-catatan').value.trim()
  };
  DATA.produk.push(prod);
  orderFormState.produkId = prod.id;
  orderFormState.showNewProd = false;
  orderFormState.newProdImg = '';

function saveOrder(){
  if(!orderFormState.produkId){ toast('Pilih produk terlebih dahulu', 'error'); return; }
  if(orderFormState.items.length === 0){ toast('Tambahkan minimal 1 varian', 'error'); return; }
  const harga = +orderFormState.hargaSatuan || 0;
  if(harga <= 0){ toast('Isi harga satuan', 'error'); return; }
  const totalQty = orderFormState.items.reduce((s,it) => s + (+it.jumlah||0), 0);
  const totalHarga = totalQty * harga;
  const dp = +document.getElementById('ob-dp').value || 0;
  const tanggalOrder = document.getElementById('ob-tanggal').value || today();

  const order = {
    id: 'ord_'+uid(),
    produkId: orderFormState.produkId,
    hargaSatuan: harga,
    items: orderFormState.items.map(it => ({...it})),
    tanggalOrder: tanggalOrder,
    totalHarga: totalHarga,
    dp: dp,
    tanggalDp: dp > 0 ? tanggalOrder : '',
    sisaBayar: totalHarga - dp,
    pembayaran: [],
    penerimaan: [],
    status: 'pending',
    catatan: document.getElementById('ob-catatan').value.trim()
  };

  if(dp > 0){
    order.pembayaran.push({ id:'pay_'+uid(), tanggal: tanggalOrder, jumlah: dp, ket:'DP awal' });
  }

  DATA.orders.push(order);
  save();

  // Reset form
  orderFormState.produkId = '';
  orderFormState.hargaSatuan = '';
  orderFormState.items = [];
  orderFormState.newProdImg = '';
  toast('Order berhasil disimpan!', 'success');

  // Switch to dashboard
  switchTab('dashboard');
}

/* ===== STOK BAHAN HELPERS (read-only) ===== */
function normJenis(s){ return String(s||'').trim().toLowerCase(); }

function getStokBahanList(){
  const map = {};
  (STOK_BAHAN.pembelian||[]).forEach(p => {
    const k = normJenis(p.jenisBahan);
    if(!k) return;
    if(!map[k]) map[k] = { nama: p.jenisBahan, beli:0, adj:0 };
    map[k].beli += (+p.kg||0);
  });
  (STOK_BAHAN.adjustment||[]).forEach(a => {
    const k = normJenis(a.jenisBahan);
    if(!k) return;
    if(!map[k]) map[k] = { nama: a.jenisBahan, beli:0, adj:0 };
    map[k].adj += (+a.kg||0);
  });
  return Object.values(map).map(b => ({
    nama: b.nama,
    saldo: Math.round((b.beli + b.adj)*100)/100
  })).sort((a,b) => a.nama.localeCompare(b.nama));
}

/* ===== CDN LOADER ===== */
function loadCdn(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[src="${src}"]`)){ res(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

/* ===== PESANAN OFFLINE ===== */
let offlineView = 'list';
let offlineSearch = '';
let offlinePage = 1;
let offlineFormState = { customer:'', kontak:'', alamat:'', items:[], deadline:'', catatan:'' };
let _offlineItemImg = '';
let _offlineSizeRows = [{ size:'', qty:'' }]; // multi-size input
let _offlineItemHarga = ''; // shared harga per model

function calcOfflineTotal(po){
  return (po.items||[]).reduce((s,it) => s + ((+it.qty||0)*(+it.harga||0)), 0);
}

function calcOfflineStatus(po){
  const totalHarga = calcOfflineTotal(po);
  const totalPaid = (po.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
  const totalItems = (po.items||[]).reduce((s,it) => s + (+it.qty||0), 0);
  const totalSelesai = (po.items||[]).reduce((s,it) => s + (+it.selesai||0), 0);
  if(totalPaid >= totalHarga && totalSelesai >= totalItems && totalItems > 0) return 'selesai';
  if(totalPaid >= totalHarga) return 'lunas';
  if(totalSelesai >= totalItems && totalItems > 0) return 'produksi_done';
  if(totalSelesai > 0) return 'produksi';
  if(totalPaid > 0) return 'dp';
  return 'pending';
}

function offlineStatusBadge(s){
  const map = {
    pending: {cls:'badge-pending', label:'🟡 Menunggu DP'},
    dp: {cls:'badge-dp', label:'🔵 DP Diterima'},
    produksi: {cls:'badge-sebagian', label:'🟠 Produksi'},
    produksi_done: {cls:'badge-lunas', label:'🧵 Produksi Selesai'},
    lunas: {cls:'badge-lunas', label:'🟢 Lunas'},
    selesai: {cls:'badge-selesai', label:'✅ Selesai'}
  };
  return `<span class="badge ${(map[s]||map.pending).cls}">${(map[s]||map.pending).label}</span>`;
}

function deadlineCountdown(dl){
  if(!dl) return '';
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dl); d.setHours(0,0,0,0);
  const diff = Math.ceil((d - now) / 86400000);
  if(diff < 0) return `<span style="color:var(--red);font-weight:600">⚠️ Terlambat ${Math.abs(diff)} hari</span>`;
  if(diff === 0) return `<span style="color:var(--orange);font-weight:600">⏰ Hari ini!</span>`;
  if(diff <= 7) return `<span style="color:var(--orange)">⏳ ${diff} hari lagi</span>`;
  return `<span style="color:var(--green)">📅 ${diff} hari lagi</span>`;
}

/* ===== OFFLINE LIST ===== */
function renderOffline(){
  if(offlineView === 'form') return renderOfflineForm();
  const el = document.getElementById('tab-offline');
  const list = DATA.pesananOffline.filter(p => !p._deleted);
  const active = list.filter(p => calcOfflineStatus(p) !== 'selesai');
  const totalPiutang = list.reduce((s,po) => {
    const paid = (po.pembayaran||[]).reduce((sp,p) => sp + (+p.jumlah||0), 0);
    return s + Math.max(0, calcOfflineTotal(po) - paid);
  }, 0);
  const overdue = active.filter(po => po.deadline && new Date(po.deadline) < new Date()).length;

  const q = offlineSearch.toLowerCase();
  const filtered = q ? list.filter(po => (po.customer||'').toLowerCase().includes(q) || (po.items||[]).some(it => (it.nama||'').toLowerCase().includes(q))) : list;
  const sorted = [...filtered].sort((a,b) => (b.tanggalOrder||'').localeCompare(a.tanggalOrder||''));
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  if(offlinePage > totalPages) offlinePage = totalPages;
  const paged = sorted.slice((offlinePage-1)*PAGE_SIZE, offlinePage*PAGE_SIZE);

  let html = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-val" style="color:var(--blue)">${active.length}</div><div class="kpi-label">Pesanan Aktif</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--red)">${rp(totalPiutang)}</div><div class="kpi-label">Piutang</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--green)">${list.filter(p=>calcOfflineStatus(p)==='selesai').length}</div><div class="kpi-label">Selesai</div></div>

      <input type="text" placeholder="🔍 Cari customer atau produk..." value="${esc(offlineSearch)}" oninput="offlineSearch=this.value;offlinePage=1;renderOffline()" style="flex:1;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px">
      <button class="btn btn-primary" onclick="offlineView='form';renderOffline()">+ Pesanan Baru</button>
    </div>`;

  if(paged.length === 0){
    html += `<div class="empty-state"><div class="icon">📋</div><p>Belum ada pesanan offline.${q?' Coba ubah pencarian.':''}</p></div>`;
  } else {
    paged.forEach(po => {
      const status = calcOfflineStatus(po);
      const total = calcOfflineTotal(po);
      const paid = (po.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
      const pctPay = total > 0 ? Math.min(100, Math.round(paid/total*100)) : 0;
      const totalQty = (po.items||[]).reduce((s,it) => s + (+it.qty||0), 0);
      const totalSelesai = (po.items||[]).reduce((s,it) => s + (+it.selesai||0), 0);
      const pctProd = totalQty > 0 ? Math.min(100, Math.round(totalSelesai/totalQty*100)) : 0;
      const hasProdId = (po.items||[]).some(it => it.produksiId);

      html += `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
            <div>
              <div style="font-weight:700;font-size:15px">🏢 ${esc(po.customer)}</div>
              <div style="font-size:12px;color:var(--muted)">${esc(po.kontak||'')} ${po.alamat?'· '+esc(po.alamat):''}</div>
            </div>
            ${offlineStatusBadge(status)}
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
            ${(po.items||[]).map(it => {
              const thumb = it.gambar ? `<img src="${it.gambar}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">` : '';
              return `<div style="display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:8px;padding:3px 8px 3px ${it.gambar?'3px':'8px'};font-size:11px">${thumb}<span>${esc(it.nama)} × ${it.qty} @${rp(it.harga)}</span></div>`;
            }).join('')}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0">
            <div>
              <div style="font-size:11px;color:var(--muted)">Pembayaran ${pctPay}%</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pctPay}%;background:${pctPay>=100?'var(--green)':'var(--blue)'}"></div></div>
              <div style="font-size:11px;margin-top:2px">${rp(paid)} / ${rp(total)}</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--muted)">Produksi ${pctProd}%</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pctProd}%;background:${pctProd>=100?'var(--green)':'var(--orange)'}"></div></div>
              <div style="font-size:11px;margin-top:2px">${totalSelesai} / ${totalQty} pcs</div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
            <div style="font-size:12px">${deadlineCountdown(po.deadline)}</div>
            <div style="font-size:11px;color:var(--muted)">${fdate(po.tanggalOrder)}</div>
          </div>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline" onclick="showOfflineDetail('${po.id}')">Detail</button>
            <button class="btn btn-sm btn-blue" onclick="showOfflineBayar('${po.id}')">Bayar</button>
            <button class="btn btn-sm btn-green" onclick="showOfflineProduksi('${po.id}')">Update Produksi</button>
            <button class="btn btn-sm btn-outline" onclick="downloadNota('${po.id}')">🖨️ Invoice</button>

            <button class="btn btn-sm btn-red" onclick="deleteOffline('${po.id}')">🗑️</button>
          </div>
        </div>`;
    });
  }

  if(totalPages > 1){
    html += `<div class="pagination">`;
    html += `<button ${offlinePage<=1?'disabled':''} onclick="offlinePage--;renderOffline()">‹</button>`;
    for(let i=1;i<=totalPages;i++) html += `<button class="${i===offlinePage?'active':''}" onclick="offlinePage=${i};renderOffline()">${i}</button>`;
    html += `<button ${offlinePage>=totalPages?'disabled':''} onclick="offlinePage++;renderOffline()">›</button></div>`;
  }
  el.innerHTML = html;
}

function renderStokBahanPanel(){
  const bahanList = getStokBahanList();

  let rows = '';
  bahanList.forEach(b => {
    const color = b.saldo <= 0 ? 'var(--red)' : b.saldo < 5 ? 'var(--orange)' : 'var(--green)';
    const warn = b.saldo <= 0 ? '⚠️ Habis' : b.saldo < 5 ? '⚠️ Tipis' : '✅';
    rows += `<tr><td style="font-size:12px">${esc(b.nama)}</td><td style="text-align:right;font-weight:600;color:${color};font-size:12px">${b.saldo}</td><td style="font-size:11px">${warn}</td></tr>`;

function addOfflineItem(){
  const nama = (document.getElementById('of-item-nama').value||'').trim();
  if(!nama){ toast('Isi nama barang', 'error'); return; }

  // Sync harga from DOM
  const hrgEl = document.getElementById('of-item-harga');
  if(hrgEl) _offlineItemHarga = hrgEl.value;
  const harga = +_offlineItemHarga || 0;
  if(harga <= 0){ toast('Harga satuan harus > 0', 'error'); return; }

  // Sync size rows from DOM
  _offlineSizeRows.forEach((row, i) => {
    const szEl = document.getElementById('of-sz-'+i);
    const qtyEl = document.getElementById('of-qty-'+i);
    if(szEl) row.size = szEl.value.trim();
    if(qtyEl) row.qty = qtyEl.value;
  });

  const validRows = _offlineSizeRows.filter(r => r.size && (+r.qty > 0));
  if(validRows.length === 0){ toast('Isi minimal 1 size dengan qty', 'error'); return; }
  const invalidRows = _offlineSizeRows.filter(r => r.size && !(+r.qty > 0));
  if(invalidRows.length > 0){ toast('Ada size yang qty-nya belum diisi', 'error'); return; }

  const img = _offlineItemImg || '';
  validRows.forEach(r => {
    offlineFormState.items.push({ id:'ofi_'+uid(), nama, size: r.size, qty: +r.qty, harga, selesai:0, gambar: img });

  _offlineItemImg = '';

  const grandTotal = offlineFormState.items.reduce((s,it) => s + ((+it.qty||0)*(+it.harga||0)), 0);
  if(grandTotal <= 0){ toast('Total harga harus > 0', 'error'); return; }
  const dp = +document.getElementById('of-dp').value || 0;

  const tanggal = document.getElementById('of-tanggal').value || today();

async function deleteOffline(poId){
  if(!confirm('Yakin hapus pesanan offline ini? Data di produksi juga akan dihapus.')) return;
  const po = DATA.pesananOffline.find(x => x.id === poId);
  if(!po) return;

  // Cascade delete: hapus entries dari soldier/produksi/produksi yang terkait order ini
  if(fbDb){
    try{
      const snap = await fbDb.ref('soldier/produksi/produksi').once('value');
      let produksiArr = snap.val() || [];
      if(!Array.isArray(produksiArr)){
        produksiArr = Object.keys(produksiArr).map(k => produksiArr[k]).filter(Boolean);
      }
      const before = produksiArr.length;
      produksiArr = produksiArr.filter(p => p._offlineOrderId !== poId);
      if(produksiArr.length < before){
        await fbDb.ref('soldier/produksi/produksi').set(produksiArr);
      }
    }catch(e){ console.error('Cascade delete produksi error', e); }
  }

  po._deleted = true;
  save(); closeModal(); toast('Pesanan offline & data produksi dihapus', 'success');
}

/* ===== KIRIM KE PRODUKSI (integrasi soldier/produksi) ===== */
async function kirimKeProduksi(poId){
  const po = DATA.pesananOffline.find(x => x.id === poId);
  if(!po) return;
  if(!fbDb){ toast('Firebase belum terhubung. Hubungkan di Setting.', 'error'); return; }

  const items = (po.items||[]).filter(it => !it.produksiId);
  if(items.length === 0){ toast('Semua item sudah dikirim ke produksi', 'info'); return; }

  const seriesName = 'OFFLINE-' + po.customer.toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,20);

  if(!confirm('Kirim '+items.length+' item ke Produksi?\n\nSeries: '+seriesName+'\nItems akan muncul di Laporan Produksi, Potong, Jahit, dan QC Command.\n\nLanjutkan?')) return;

  toast('Mengirim ke produksi...', 'info');

  try{
    // Read current produksi data
    const snap = await fbDb.ref('soldier/produksi/produksi').once('value');
    let produksiArr = snap.val() || [];
    // Convert Firebase object to array if needed
    if(!Array.isArray(produksiArr)){
      produksiArr = Object.values(produksiArr).filter(x => x != null);
    }

    // Create produksi entries for each offline item
    const newEntries = [];
    items.forEach(it => {
      const entry = {
        id: 'off_'+uid()+Math.random().toString(36).slice(2,4),
        series: seriesName,
        namaBarang: it.nama,
        size: it.size || 'All Size',
        poAktif: true,
        potong: [],
        bigSaller: [],
        bayarJahit: [],
        gudang: [],
        jahit: [],
        assignJahit: [],
        qc: [],
        _offlineOrderId: po.id,
        _offlineItemId: it.id,
        _offlineCustomer: po.customer,
        _offlineQty: it.qty,
        _offlineDeadline: po.deadline || ''
      };
      newEntries.push(entry);
      // Save produksiId back to the offline item
      it.produksiId = entry.id;
    });

    // Append and push
    produksiArr = produksiArr.concat(newEntries);
    await fbDb.ref('soldier/produksi/produksi').set(produksiArr);

    // Save offline data with produksiId references
    save();
    toast('✅ '+newEntries.length+' item berhasil dikirim ke Produksi! Cek Laporan Produksi.', 'success');
    renderOffline();
  }catch(e){
    console.error('Kirim ke produksi error:', e);
    toast('Gagal kirim ke produksi: '+e.message, 'error');
  }
}

/* ===== TAB SWITCHING ===== */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+tab));
  debouncedRender();
}

document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});
