<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#14180f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Retur Command — SoldierApparel v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#14180f;--panel:#1c2218;--panel2:#232a1d;--border:#3a4533;
  --gold:#c4a572;--khaki:#a89060;
  --text:#e8e6df;--muted:#8a917f;
  --green:#6b9a4f;--greenbg:rgba(107,154,79,.15);
  --red:#c0584a;--redbg:rgba(192,88,74,.15);
  --blue:#5e8aa8;--bluebg:rgba(94,138,168,.15);
  --orange:#d4943a;--orangebg:rgba(212,148,58,.15)
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;padding:0;font-size:15px;overflow-x:hidden}
.wrap{max-width:700px;margin:0 auto;padding:14px}
.back-btn{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;margin-bottom:10px}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}
.hdr{border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:20px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:800;margin:0}
.sub{color:var(--muted);font-size:11px;letter-spacing:1px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 6px;text-align:center}
.stat .lbl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.stat .val{font-size:22px;font-weight:800;margin-top:2px}
.stat .xtra{font-size:9px;color:var(--muted);margin-top:1px}
.stat.s-total .val{color:var(--gold)}
.stat.s-bagus{border-color:var(--green)} .stat.s-bagus .val{color:var(--green)}
.stat.s-fix{border-color:var(--blue)} .stat.s-fix .val{color:var(--blue)}
.stat.s-reject{border-color:var(--red)} .stat.s-reject .val{color:var(--red)}
.stat.s-hilang{border-color:var(--orange)} .stat.s-hilang .val{color:var(--orange)}
.stat.s-sold{border-color:var(--khaki)} .stat.s-sold .val{color:var(--khaki)}
@media(max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
.cpanel{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.cpanel-head{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.cpanel-head h2{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--khaki);font-weight:700;margin:0}
.cpanel-head .arr{color:var(--muted);font-size:14px;transition:transform .2s}
.cpanel-head .arr.open{transform:rotate(180deg)}
.cpanel-body{padding:0 14px 14px;display:none}
.cpanel-body.show{display:block}
label{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 10px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.frow{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.frow>div{flex:1;min-width:100px}
.size-grid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.size-item{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:center;min-width:54px}
.size-item .sz{font-size:10px;font-weight:700;color:var(--khaki);letter-spacing:.5px;margin-bottom:3px}
.size-item input{width:46px;text-align:center;padding:5px 4px;font-size:13px}
.btn{border:none;border-radius:6px;padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.12)}
.btn-gold{background:var(--gold);color:#14180f}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.searchbar{position:relative;margin-bottom:12px}
.searchbar input{padding-left:34px}
.searchbar .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.searchbar .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;display:none}
.tabs{display:flex;gap:0;margin-bottom:12px;overflow-x:auto;border-bottom:2px solid var(--border);-webkit-overflow-scrolling:touch}
.tab{padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab .cnt{background:var(--panel2);font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px}
.grp-hdr{font-size:11px;color:var(--khaki);font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:8px 4px 4px;margin-top:8px;display:flex;align-items:center;gap:6px}
.grp-hdr .gcnt{color:var(--muted);font-weight:400;font-size:10px}
.item{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:6px;transition:border-color .15s}
.item:hover{border-color:var(--khaki)}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .nm{font-weight:700;font-size:14px;color:var(--text)}
.item .detail{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:9px;font-weight:800;padding:2px 8px;border-radius:10px;letter-spacing:.5px;text-transform:uppercase}
.badge-bagus{background:var(--greenbg);color:var(--green);border:1px solid var(--green)}
.badge-diperbaiki{background:var(--bluebg);color:var(--blue);border:1px solid var(--blue)}
.badge-reject{background:var(--redbg);color:var(--red);border:1px solid var(--red)}
.badge-hilang{background:var(--orangebg);color:var(--orange);border:1px solid var(--orange)}
.item .note{font-size:11px;color:var(--muted);margin-top:5px;background:var(--panel2);padding:4px 8px;border-radius:4px;font-style:italic}
.item .acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.item .acts button{padding:5px 9px;font-size:11px;letter-spacing:.3px;border:none;border-radius:5px;cursor:pointer;font-weight:700;font-family:inherit}
.item .acts button:hover{filter:brightness(1.15)}
.b-bagus{background:var(--green);color:#0f1409}
.b-fix{background:var(--blue);color:#fff}
.b-reject{background:var(--red);color:#fff}
.b-hilang{background:var(--orange);color:#fff}
.b-jual{background:var(--gold);color:#14180f}
.b-edit{background:transparent;border:1px solid var(--border);color:var(--muted)}
.b-edit:hover{border-color:var(--gold);color:var(--gold)}
.b-del{background:transparent;border:1px solid var(--border);color:var(--muted)}
.b-del:hover{border-color:var(--red)!important;color:var(--red)}
.qty-tag{background:var(--panel2);border:1px solid var(--border);padding:1px 7px;border-radius:4px;font-size:12px;font-weight:700;color:var(--gold)}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:24px 0}
.foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.foot button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 12px;font-size:11px;border-radius:6px;cursor:pointer;font-family:inherit}
.foot button:hover{border-color:var(--gold);color:var(--gold)}
.foot .reset:hover{border-color:var(--red);color:var(--red)}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bx{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;max-width:440px;width:100%}
.modal-bx h3{font-size:14px;color:var(--gold);margin-bottom:12px}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal-acts button{padding:9px 16px;font-size:12px;font-weight:700;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.m-no{background:transparent;border:1px solid var(--border)!important;color:var(--muted)}
.m-yes{background:var(--green);color:#0f1409}
.m-del{background:var(--red);color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:8px;font-size:12px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
/* splash */
.splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
.splash.hide{opacity:0;pointer-events:none}
.splash-inner{text-align:center}
.splash-inner img{width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);margin-bottom:12px}
.splash-inner h2{color:var(--gold);font-size:16px;letter-spacing:2px;text-transform:uppercase}
.splash-inner p{color:var(--muted);font-size:11px;margin-top:4px}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splash-inner">
    <img src="https://soldierapparelid.github.io/soldierapparel-app/logo.png" alt="logo" onerror="this.style.display='none'">
    <h2>Retur Command</h2>
    <p>Inventory Barang Retur</p>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none">

<a href="index.html" class="back-btn" onclick="event.preventDefault();window.location.href='index.html';">&#8592; DASHBOARD</a>

<div class="hdr">
  <div>
    <h1>RETUR COMMAND</h1>
    <div class="sub">Inventory Barang Retur &mdash; Data, Cari, Kelola</div>
  </div>
  <div style="color:var(--muted);font-size:10px;letter-spacing:1px">v5</div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat s-total"><div class="lbl">Total</div><div class="val" id="stTotal">0</div><div class="xtra" id="stTotalX"></div></div>
  <div class="stat s-bagus"><div class="lbl">Bagus</div><div class="val" id="stBagus">0</div><div class="xtra" id="stBagusX">bisa dijual</div></div>
  <div class="stat s-fix"><div class="lbl">Diperbaiki</div><div class="val" id="stFix">0</div><div class="xtra" id="stFixX"></div></div>
  <div class="stat s-reject"><div class="lbl">Reject</div><div class="val" id="stReject">0</div><div class="xtra" id="stRejectX"></div></div>
  <div class="stat s-hilang"><div class="lbl">Hilang</div><div class="val" id="stHilang">0</div><div class="xtra" id="stHilangX"></div></div>
  <div class="stat s-sold"><div class="lbl">Terjual</div><div class="val" id="stSold">0</div><div class="xtra" id="stSoldX">dijual ulang</div></div>
</div>

<!-- ADD FORM -->
<div class="cpanel" id="pAdd">
  <div class="cpanel-head" onclick="togglePanel('pAdd')">
    <h2>&#x2795; TAMBAH BARANG RETUR</h2>
    <span class="arr open" id="pAdd-arr">&#x25BC;</span>
  </div>
  <div class="cpanel-body show" id="pAdd-body">
    <div class="frow">
      <div style="flex:2"><label>Series</label><input id="fSeries" placeholder="cth: PHANTOM TNI AD" list="seriesList"><datalist id="seriesList"></datalist></div>
      <div style="flex:2"><label>Nama Barang</label><input id="fNama" placeholder="cth: Kaos Tactical" list="namaList"><datalist id="namaList"></datalist></div>
    </div>
    <div class="frow">
      <div style="flex:2"><label>Warna</label><input id="fWarna" placeholder="cth: Hijau Army" list="warnaList"><datalist id="warnaList"></datalist></div>
      <div><label>Status</label>
        <select id="fStatus">
          <option value="bagus">&#x2705; Bagus</option>
          <option value="diperbaiki">&#x1F527; Diperbaiki</option>
          <option value="reject">&#x274C; Reject</option>
          <option value="hilang">&#x26A0;&#xFE0F; Hilang</option>
        </select>
      </div>
    </div>
    <label>Size &amp; Qty (isi jumlah di size yang ada)</label>
    <div class="size-grid" id="sizeGrid"></div>
    <div class="frow">
      <div style="flex:3"><label>Catatan (opsional)</label><input id="fCatatan" placeholder="cth: Ada noda kecil di lengan kanan"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-gold" onclick="tambahBarang()">&#x2795; Tambah</button>
      <button class="btn btn-ghost" onclick="resetForm()">Reset</button>
    </div>
  </div>
</div>

<!-- SEARCH -->
<div class="searchbar">
  <span class="icon">&#x1F50D;</span>
  <input id="search" placeholder="Cari series, nama, warna, size..." oninput="onSearch()">
  <button class="clr" id="searchClr" onclick="clearSearch()">&#x2715;</button>
</div>

<!-- TABS -->
<div class="tabs" id="tabsBar">
  <div class="tab active" data-tab="semua" onclick="setTab('semua')">Semua</div>
  <div class="tab" data-tab="bagus" onclick="setTab('bagus')">&#x2705; Bagus</div>
  <div class="tab" data-tab="diperbaiki" onclick="setTab('diperbaiki')">&#x1F527; Diperbaiki</div>
  <div class="tab" data-tab="reject" onclick="setTab('reject')">&#x274C; Reject</div>
  <div class="tab" data-tab="hilang" onclick="setTab('hilang')">&#x26A0; Hilang</div>
</div>

<!-- ITEM LIST -->
<div id="itemList"></div>

<!-- FOOTER -->
<div class="foot">
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="backupJSON()">Backup JSON</button>
  <button onclick="document.getElementById('restoreFile').click()">Restore JSON</button>
  <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreJSON(event)">
  <button onclick="importV4()">Import Data v4</button>
  <button class="reset" onclick="resetAll()">Reset Semua</button>
</div>

</div><!-- wrap -->

<!-- EDIT MODAL -->
<div class="modal-ov" id="editModal">
  <div class="modal-bx">
    <h3>&#x270F;&#xFE0F; Edit Barang</h3>
    <div class="frow">
      <div><label>Series</label><input id="eSeries"></div>
      <div><label>Nama Barang</label><input id="eNama"></div>
    </div>
    <div class="frow">
      <div><label>Warna</label><input id="eWarna"></div>
      <div style="max-width:90px"><label>Size</label><input id="eSize"></div>
      <div style="max-width:70px"><label>Qty</label><input type="number" id="eQty" min="1"></div>
    </div>
    <div class="frow">
      <div><label>Status</label>
        <select id="eStatus">
          <option value="bagus">Bagus</option>
          <option value="diperbaiki">Diperbaiki</option>
          <option value="reject">Reject</option>
          <option value="hilang">Hilang</option>
        </select>
      </div>
      <div style="flex:2"><label>Catatan</label><input id="eCatatan"></div>
    </div>
    <div class="modal-acts">
      <button class="m-no" onclick="closeEdit()">Batal</button>
      <button class="m-yes" onclick="saveEdit()">Simpan</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-ov" id="cfmModal">
  <div class="modal-bx">
    <div id="cfmMsg" style="font-size:13px;white-space:pre-line;margin-bottom:4px"></div>
    <div class="modal-acts">
      <button class="m-no" id="cfmNo">Batal</button>
      <button class="m-del" id="cfmYes">Ya</button>
    </div>
  </div>
</div>

<!-- JUAL MODAL -->
<div class="modal-ov" id="jualModal">
  <div class="modal-bx">
    <h3>&#x1F4B0; Jual Ulang</h3>
    <div id="jualInfo" style="font-size:13px;margin-bottom:10px"></div>
    <div class="frow">
      <div><label>Jumlah Dijual</label><input type="number" id="jualQty" min="1" value="1"></div>
    </div>
    <div class="modal-acts">
      <button class="m-no" onclick="closeJual()">Batal</button>
      <button class="m-yes" onclick="konfirmasiJual()" style="background:var(--gold);color:#14180f">Jual</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== RETUR COMMAND v5 — Inventory Barang Retur ===== */
var KEY='returCommand_v5';
var SIZES=['M','L','XL','XXL'];
var DB=[];
var SOLD_KEY='returCommand_v5_sold';
var totalSold=0;
var activeTab='semua';
var searchQ='';
var _editId=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){return new Date().toISOString().slice(0,10);}
function $(id){return document.getElementById(id);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var _tt;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},2500);}

/* DATA */
function load(){try{var d=localStorage.getItem(KEY);if(d)DB=JSON.parse(d);var s=localStorage.getItem(SOLD_KEY);if(s)totalSold=parseInt(s)||0;}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem(SOLD_KEY,String(totalSold));}catch(e){toast('Gagal simpan!');}}

/* PANEL */
function togglePanel(id){
  var body=$(id+'-body');
  var arr=$(id+'-arr');
  body.classList.toggle('show');
  arr.classList.toggle('open');
}

/* SIZE GRID */
function initSizeGrid(){
  var html='';
  SIZES.forEach(function(s){
    var sid='fSz_'+s.replace(/\s/g,'_');
    html+='<div class="size-item"><div class="sz">'+s+'</div><input type="number" min="0" value="" placeholder="0" id="'+sid+'" onfocus="this.select()"></div>';
  });
  $('sizeGrid').innerHTML=html;
}

/* AUTOCOMPLETE DATALISTS */
function updateDataLists(){
  var series=new Set(), names=new Set(), colors=new Set();
  DB.forEach(function(x){
    if(x.series) series.add(x.series);
    if(x.namaBarang) names.add(x.namaBarang);
    if(x.warna) colors.add(x.warna);
  });
  $('seriesList').innerHTML=Array.from(series).map(function(s){return'<option value="'+esc(s)+'">';}).join('');
  $('namaList').innerHTML=Array.from(names).map(function(s){return'<option value="'+esc(s)+'">';}).join('');
  $('warnaList').innerHTML=Array.from(colors).map(function(s){return'<option value="'+esc(s)+'">';}).join('');
}

/* ADD */
function tambahBarang(){
  var series=$('fSeries').value.trim();
  var nama=$('fNama').value.trim();
  var warna=$('fWarna').value.trim();
  var status=$('fStatus').value;
  var catatan=$('fCatatan').value.trim();
  if(!nama&&!series){toast('Isi Series atau Nama Barang.');return;}
  var added=0;
  SIZES.forEach(function(s){
    var inp=$('fSz_'+s.replace(/\s/g,'_'));
    var qty=parseInt(inp.value)||0;
    if(qty>0){
      DB.unshift({
        id:uid(), series:series, namaBarang:nama, warna:warna,
        size:s, qty:qty, status:status, catatan:catatan,
        tanggal:today(), tanggalUpdate:today()
      });
      added++;
    }
  });
  if(added===0){toast('Isi qty minimal 1 size.');return;}
  save(); render(); updateDataLists();
  // Keep series/nama/warna, clear sizes + catatan for quick re-entry
  SIZES.forEach(function(s){$('fSz_'+s.replace(/\s/g,'_')).value='';});
  $('fCatatan').value='';
  toast(added+' item ditambahkan.');
}

function resetForm(){
  $('fSeries').value=''; $('fNama').value=''; $('fWarna').value=''; $('fCatatan').value='';
  $('fStatus').value='bagus';
  SIZES.forEach(function(s){$('fSz_'+s.replace(/\s/g,'_')).value='';});
}

/* SEARCH */
function onSearch(){
  searchQ=$('search').value.trim().toLowerCase();
  $('searchClr').style.display=searchQ?'block':'none';
  render();
}
function clearSearch(){$('search').value='';onSearch();}
function matchSearch(item){
  if(!searchQ)return true;
  var hay=((item.series||'')+'|'+(item.namaBarang||'')+'|'+(item.warna||'')+'|'+(item.size||'')+'|'+(item.catatan||'')).toLowerCase();
  return searchQ.split(/\s+/).every(function(w){return hay.indexOf(w)!==-1;});
}

/* TABS */
function setTab(t){
  activeTab=t;
  document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);});
  render();
}

/* STATUS */
function setStatus(id,ns){
  var item=DB.find(function(x){return x.id===id;});
  if(!item)return;
  item.status=ns;
  item.tanggalUpdate=today();
  save(); render();
}

/* EDIT */
function openEdit(id){
  _editId=id;
  var item=DB.find(function(x){return x.id===id;});
  if(!item)return;
  $('eSeries').value=item.series||'';
  $('eNama').value=item.namaBarang||'';
  $('eWarna').value=item.warna||'';
  $('eSize').value=item.size||'';
  $('eQty').value=item.qty||1;
  $('eStatus').value=item.status||'bagus';
  $('eCatatan').value=item.catatan||'';
  $('editModal').style.display='flex';
}
function closeEdit(){$('editModal').style.display='none';_editId=null;}
function saveEdit(){
  var item=DB.find(function(x){return x.id===_editId;});
  if(!item)return;
  item.series=$('eSeries').value.trim();
  item.namaBarang=$('eNama').value.trim();
  item.warna=$('eWarna').value.trim();
  item.size=$('eSize').value.trim();
  item.qty=parseInt($('eQty').value)||1;
  item.status=$('eStatus').value;
  item.catatan=$('eCatatan').value.trim();
  item.tanggalUpdate=today();
  save(); render(); updateDataLists(); closeEdit();
  toast('Item diupdate.');
}

/* DELETE */
function hapus(id){
  var item=DB.find(function(x){return x.id===id;});
  if(!item)return;
  askConfirm('Hapus item ini?\n\n'+(item.series?item.series+' — ':'')+esc(item.namaBarang)+' ('+item.size+')',function(){
    DB=DB.filter(function(x){return x.id!==id;});
    save(); render(); toast('Item dihapus.');
  });
}
function askConfirm(msg,onYes){
  $('cfmMsg').textContent=msg;
  $('cfmModal').style.display='flex';
  $('cfmYes').onclick=function(){$('cfmModal').style.display='none';onYes();};
  $('cfmNo').onclick=function(){$('cfmModal').style.display='none';};
}

/* JUAL ULANG */
var _jualId=null;
function jualBarang(id){
  _jualId=id;
  var item=DB.find(function(x){return x.id===id;});
  if(!item)return;
  $('jualInfo').textContent=(item.series?item.series+' — ':'')+
    (item.namaBarang||'Tanpa nama')+' ('+item.size+') — stok: '+item.qty;
  $('jualQty').value=1;
  $('jualQty').max=item.qty;
  $('jualModal').style.display='flex';
}
function closeJual(){$('jualModal').style.display='none';_jualId=null;}
function konfirmasiJual(){
  var item=DB.find(function(x){return x.id===_jualId;});
  if(!item)return;
  var jml=parseInt($('jualQty').value)||0;
  if(jml<1){toast('Minimal jual 1.');return;}
  if(jml>item.qty){toast('Melebihi stok ('+item.qty+').');return;}
  item.qty-=jml;
  totalSold+=jml;
  item.tanggalUpdate=today();
  if(item.qty<=0){
    DB=DB.filter(function(x){return x.id!==_jualId;});
    toast(jml+' pcs terjual — item dihapus (stok habis).');
  }else{
    toast(jml+' pcs terjual. Sisa stok: '+item.qty);
  }
  save(); render(); closeJual();
}

/* RENDER */
function render(){
  var cBagus=0, cFix=0, cReject=0, cHilang=0;
  var qBagus=0, qFix=0, qReject=0, qHilang=0;
  DB.forEach(function(x){
    var q=x.qty||1;
    if(x.status==='bagus'){cBagus++;qBagus+=q;}
    else if(x.status==='diperbaiki'){cFix++;qFix+=q;}
    else if(x.status==='reject'){cReject++;qReject+=q;}
    else if(x.status==='hilang'){cHilang++;qHilang+=q;}
  });
  var total=qBagus+qFix+qReject+qHilang;
  $('stTotal').textContent=total;
  $('stTotalX').textContent=DB.length+' entry';
  $('stBagus').textContent=qBagus;
  $('stBagusX').textContent=cBagus?cBagus+' entry':'bisa dijual';
  $('stFix').textContent=qFix;
  $('stFixX').textContent=cFix?cFix+' entry':'';
  $('stReject').textContent=qReject;
  $('stRejectX').textContent=cReject?cReject+' entry':'';
  $('stHilang').textContent=qHilang;
  $('stHilangX').textContent=cHilang?cHilang+' entry':'';
  $('stSold').textContent=totalSold;
  $('stSoldX').textContent='dijual ulang';

  // Tab counts
  var counts={semua:DB.length,bagus:cBagus,diperbaiki:cFix,reject:cReject,hilang:cHilang};
  document.querySelectorAll('.tab').forEach(function(el){
    var t=el.dataset.tab, cnt=counts[t]||0;
    var cntEl=el.querySelector('.cnt');
    if(cnt>0){
      if(!cntEl){cntEl=document.createElement('span');cntEl.className='cnt';el.appendChild(cntEl);}
      cntEl.textContent=cnt;
    }else if(cntEl){cntEl.remove();}
  });

  // Filter
  var visible=DB.slice();
  if(activeTab!=='semua')visible=visible.filter(function(x){return x.status===activeTab;});
  visible=visible.filter(matchSearch);

  if(visible.length===0){
    $('itemList').innerHTML='<div class="empty">'+(searchQ?'Tidak ditemukan.':'Belum ada data.')+'</div>';
    return;
  }

  // Group by series
  var groups={}, order=[];
  visible.forEach(function(item){
    var key=(item.series||'').toUpperCase()||'TANPA SERIES';
    if(!groups[key]){groups[key]=[];order.push(key);}
    groups[key].push(item);
  });

  var html='';
  order.forEach(function(key){
    var items=groups[key];
    var totalQ=items.reduce(function(a,b){return a+(b.qty||1);},0);
    html+='<div class="grp-hdr">'+esc(key)+' <span class="gcnt">('+items.length+' entry, '+totalQ+' pcs)</span></div>';
    items.forEach(function(item){html+=renderItem(item);});
  });
  $('itemList').innerHTML=html;
}

function renderItem(item){
  var statusLabel={bagus:'Bagus',diperbaiki:'Diperbaiki',reject:'Reject',hilang:'Hilang'};
  var badgeCls='badge-'+item.status;
  var acts='';
  if(item.status!=='bagus')acts+='<button class="b-bagus" onclick="setStatus(\''+item.id+'\',\'bagus\')">&#x2705; Bagus</button>';
  if(item.status!=='diperbaiki')acts+='<button class="b-fix" onclick="setStatus(\''+item.id+'\',\'diperbaiki\')">&#x1F527; Perbaiki</button>';
  if(item.status!=='reject')acts+='<button class="b-reject" onclick="setStatus(\''+item.id+'\',\'reject\')">&#x274C; Reject</button>';
  if(item.status!=='hilang')acts+='<button class="b-hilang" onclick="setStatus(\''+item.id+'\',\'hilang\')">&#x26A0; Hilang</button>';
  if(item.status==='bagus')acts+='<button class="b-jual" onclick="jualBarang(\''+item.id+'\')">&#x1F4B0; Jual</button>';
  acts+='<button class="b-edit" onclick="openEdit(\''+item.id+'\')">&#x270F;</button>';
  acts+='<button class="b-del" onclick="hapus(\''+item.id+'\')">&#x1F5D1;</button>';

  var displayName=item.namaBarang||(item.series||'Tanpa nama');
  var html='<div class="item"><div class="top"><div>';
  html+='<div class="nm">'+esc(displayName)+' <span class="badge '+badgeCls+'">'+statusLabel[item.status]+'</span></div>';
  html+='<div class="detail">';
  if(item.warna)html+='<span>&#x1F3A8; '+esc(item.warna)+'</span>';
  html+='<span>&#x1F4CF; '+esc(item.size)+'</span>';
  if(item.qty>1)html+='<span class="qty-tag">&times;'+item.qty+'</span>';
  html+='<span style="color:var(--muted);font-size:10px">'+item.tanggal+'</span>';
  html+='</div></div></div>';
  if(item.catatan)html+='<div class="note">&#x1F4DD; '+esc(item.catatan)+'</div>';
  html+='<div class="acts">'+acts+'</div></div>';
  return html;
}

/* EXPORT */
function exportCSV(){
  var head=['Series','NamaBarang','Warna','Size','Qty','Status','Catatan','Tanggal','TanggalUpdate'];
  var rows=DB.map(function(i){
    return[i.series,i.namaBarang,i.warna,i.size,i.qty,i.status,i.catatan,i.tanggal,i.tanggalUpdate]
      .map(function(c){return'"'+String(c||'').replace(/"/g,'""')+'"';}).join(',');
  });
  dl('retur-v5-'+today()+'.csv','data:text/csv;charset=utf-8,'+encodeURIComponent([head.join(',')].concat(rows).join('\n')));
}
function backupJSON(){dl('retur-v5-backup-'+today()+'.json','data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB,null,2)));}
function restoreJSON(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(Array.isArray(d)){
        askConfirm('Restore akan mengganti SEMUA data.\nLanjut? ('+d.length+' item)',function(){
          DB=d;save();render();updateDataLists();toast('Restore berhasil: '+d.length+' item.');
        });
      }else toast('Format tidak valid.');
    }catch(err){toast('Gagal baca file.');}
  };
  r.readAsText(f);
  e.target.value='';
}
function importV4(){
  try{
    var raw=localStorage.getItem('returCommand_v4');
    if(!raw){toast('Tidak ada data v4.');return;}
    var v4=JSON.parse(raw);
    if(!Array.isArray(v4)||!v4.length){toast('Data v4 kosong.');return;}
    askConfirm('Ditemukan '+v4.length+' item dari Retur v4.\nImport ke v5? (data v5 tidak dihapus)',function(){
      var count=0;
      v4.forEach(function(old){
        var status='bagus';
        if(old.status==='reject')status='reject';
        else if(old.status==='fix'||old.status==='diperbaiki')status='diperbaiki';
        DB.push({
          id:uid(), series:'', namaBarang:old.namaProduk||old.nama||'',
          warna:old.variasi||'', size:'', qty:old.qty||1, status:status,
          catatan:(old.catatan||'')+' (import v4)',
          tanggal:old.tglImport||old.tglPesanan||today(), tanggalUpdate:today()
        });
        count++;
      });
      save();render();updateDataLists();
      toast(count+' item berhasil diimport.');
    });
  }catch(e){toast('Error: '+e.message);}
}
function dl(name,uri){var a=document.createElement('a');a.download=name;a.href=uri;a.click();}
function resetAll(){askConfirm('Hapus SEMUA data retur?\nTidak bisa dibalikin.',function(){DB=[];totalSold=0;save();render();updateDataLists();toast('Data direset.');});}

/* SPLASH + INIT */
load();
initSizeGrid();
updateDataLists();
render();
setTimeout(function(){
  $('splash').classList.add('hide');
  $('mainWrap').style.display='block';
  setTimeout(function(){$('splash').style.display='none';},500);
},800);
</script>
