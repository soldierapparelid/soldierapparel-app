name: Purchase item identity tests
on:
  pull_request:
    paths:
      - 'pembelian-produk-v1.html'
      - 'tests/purchase-item-identity.test.cjs'
      - '.github/workflows/purchase-item-identity-test.yml'
permissions:
  contents: read
jobs:
  purchase-item-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Preserve item identity and historical receipt/payment data
        run: node --test tests/purchase-item-identity.test.cjs
