name: Cutting entry regression tests
on:
  pull_request:
    paths:
      - 'laporan-produksi.html'
      - 'potong-command.html'
      - 'cutting-plan-worker.js'
      - 'tests/cutting-entry-edit.test.cjs'
      - 'tests/cutting-material-choice.test.cjs'
      - '.github/workflows/cutting-entry-tests.yml'
permissions:
  contents: read
jobs:
  cutting-entry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test synthetic cutting edits without database or secrets
        run: node --test tests/cutting-entry-edit.test.cjs tests/cutting-material-choice.test.cjs
