name: Division access tests
on:
  pull_request:
    paths:
      - '*.html'
      - 'access-*.js'
      - 'access-control.css'
      - 'security/**'
      - 'tests/**'
      - '.github/workflows/division-access-test.yml'
permissions:
  contents: read
jobs:
  isolated-access-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: App authorization and compatibility tests
        run: node --test tests/access-control.test.cjs
      - name: Install isolated test dependencies
        working-directory: security
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile rules and test permissions in a local demo database
        working-directory: security
        run: npm run test:rules
