name: Division access tests
on:
  pull_request:
    paths:
      - '*.html'
      - 'access-*.js'
      - 'maklon-*.js'
      - 'account-storage.js'
      - 'operations-codec.js'
      - 'production-*.js'
      - 'production-form-ui.css'
      - 'production-owner-tariff-ui.css'
      - 'production-owner-wage-ui.css'
      - 'access-control.css'
      - 'security/**'
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/division-access-test.yml'
permissions:
  contents: read
jobs:
  isolated-access-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: App authorization, compatibility and private finance rehearsal tests
        run: node --test tests/*.test.cjs
      - name: Install isolated test dependencies
        working-directory: security
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile rules and test permissions in a local demo database
        working-directory: security
        run: npm run test:rules
      - name: Test compatible legacy root CAS in a fresh isolated demo database
        working-directory: security
        run: npm run test:legacy-operations
