<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11191d">
<meta name="description" content="Pusat kerja SoldierApparel. Akses aplikasi produksi dan administrasi melalui menu besar yang mudah dipakai.">
<title>Dashboard Soldier Apparel</title>
<link rel="manifest" href="manifest.json?v=20260923-install">
<link rel="stylesheet" href="app-install.css?v=20260923-install">
<script defer src="app-install.js?v=20260923-install"></script>
<link rel="icon" href="logo-elang.png" type="image/png">
<link rel="apple-touch-icon" href="logo-elang.png">
<style>
:root{color-scheme:dark;--bg:#11191d;--panel:#1a262c;--line:#425860;--text:#f1f6f8;--muted:#c0cdd2;--green:#86e3c3;--gold:#86e3c3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:36px 20px 30px;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;background-color:var(--bg);background-image:linear-gradient(#86e3c309 1px,transparent 1px),linear-gradient(90deg,#86e3c309 1px,transparent 1px),radial-gradient(circle at 50% -20%,#86e3c321,transparent 50%),radial-gradient(circle at -20% 120%,#274b4933,transparent 50%),radial-gradient(circle at 120% 120%,#274b4933,transparent 50%);background-size:30px 30px,30px 30px,100% 100%,100% 100%,100% 100%;background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:4px}
[hidden]{display:none!important}
.bg-watermark{position:fixed;inset:0;background:url('logo-elang.png') no-repeat center;background-size:min(80vw,560px);opacity:.035;pointer-events:none}
.shell{position:relative;width:100%;max-width:600px;margin:auto}
.skip-link{position:absolute;left:0;top:-150px;z-index:4;background:var(--green);color:#0d1117;padding:12px 18px;border-radius:10px;font-weight:700}.skip-link:focus{top:0}
.header-container{text-align:center;margin-bottom:28px;display:flex;flex-direction:column;align-items:center}
.header-logo{width:96px;height:96px;object-fit:contain;background:white;border-radius:50%;border:2px solid #86e3c366;box-shadow:0 0 0 7px #86e3c30b,0 12px 28px #0005;margin-bottom:18px}
.logo-text{color:var(--green);font-size:clamp(26px,6.5vw,32px);font-weight:800;line-height:1.25;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 20px #a3c0774d;margin:0 0 10px}
.sub-text{margin:0;color:#bdc9d6;font-size:16px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:#0008;padding:5px 16px;border-radius:24px;border:1px solid #ffffff12}
.tab-bar{display:flex;position:relative;width:100%;background:#152127;border:1px solid #425860;border-radius:16px;margin-bottom:24px;padding:5px;gap:5px}
.tab{flex:1;min-width:0;min-height:60px;padding:14px 10px;font-size:20px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#bdc9d6;background:transparent;border:0;border-radius:13px;position:relative}
.tab.active{color:#102c24;background:var(--green);box-shadow:0 3px 10px #0003}
.section-label{font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#bdc9c0;margin:0 0 16px;padding-left:4px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.menu-card{width:100%;min-width:0;min-height:188px;padding:24px 14px;background:linear-gradient(145deg,#1e2c33f5,#172329f5);border:1px solid #47616c;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--green);box-shadow:0 8px 20px #0003,inset 0 1px 0 #ffffff08;transition:background .2s,border-color .2s,transform .2s}
.menu-card:hover{background:#263941;border-color:var(--green);transform:translateY(-3px);box-shadow:0 12px 26px #0004}
.app-icon{width:44px;height:44px;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.icon-badge{display:grid;place-items:center;width:70px;height:70px;border-radius:20px;background:#86e3c315;box-shadow:inset 0 0 0 1px #86e3c330;color:#86e3c3}
.icon-badge.sewing,.icon-badge.invoice{background:#96caff15;box-shadow:inset 0 0 0 1px #96caff30;color:#96caff}
.icon-badge.quality,.icon-badge.returns{background:#c5b4ff15;box-shadow:inset 0 0 0 1px #c5b4ff30;color:#c5b4ff}
.icon-badge.production,.icon-badge.hpp{background:#efd49a15;box-shadow:inset 0 0 0 1px #efd49a30;color:#efd49a}
.app-title{font-size:20px;font-weight:800;color:var(--text);text-align:center;line-height:1.35;overflow-wrap:anywhere}
.gaji-card .app-title,.nota-card .app-title{color:var(--text)}
.refresh-btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px;margin:30px auto 0;padding:12px 24px;background:#141814e6;color:#d2dbd5;border:1px solid #475a4a;border-radius:50px;font-size:18px;font-weight:700;box-shadow:0 4px 10px #0005}
.refresh-btn:hover{background:#a3c0771a;color:var(--green);border-color:var(--green)}.refresh-btn .app-icon{width:24px;height:24px}
.pin-dialog{width:calc(100% - 28px);max-width:420px;max-height:calc(100dvh - 28px);overflow:auto;padding:26px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);box-shadow:0 24px 80px #0005}
.pin-dialog::backdrop{background:#07140ecc}
.pin-dialog h2{font-size:24px;margin:0 0 8px}.pin-dialog p{font-size:16px;margin:0 0 18px;color:var(--muted)}
.pin-dialog label{display:block;font-size:18px;font-weight:700;margin:0 0 8px}
.pin-dialog input{display:block;width:100%;min-height:58px;padding:12px 14px;font:inherit;font-size:24px;letter-spacing:4px;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px}
.pin-dialog input:focus{outline:3px solid var(--green);outline-offset:2px}
.pin-dialog .pin-error{min-height:25px;margin:12px 0;color:#ffaaaa;font-weight:650}
.pin-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pin-actions button{min-height:56px;font-size:18px;font-weight:750;padding:12px;border-radius:10px;border:2px solid var(--line);color:var(--text);background:transparent}.pin-actions .pin-submit{background:var(--gold);border-color:var(--gold);color:#13251b}

@media(max-width:680px){body{padding:28px 16px}.menu-card{min-height:180px;padding:22px 12px}.menu-grid{gap:14px}.header-container{margin-bottom:24px}}
@media(max-width:380px){body{padding:24px 12px}.menu-grid{grid-template-columns:minmax(0,1fr)}.logo-text{font-size:26px;letter-spacing:1px}.menu-card{min-height:160px}.tab{font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}.menu-card:hover{transform:none}}
</style>
</head>
<body>
<div class="bg-watermark" aria-hidden="true"></div>
<div class="shell">
<a class="skip-link" href="#tab0">Langsung ke menu aplikasi</a>
<header class="header-container">
<img src="logo-elang.png" alt="Logo elang SoldierApparel" class="header-logo" width="96" height="96">
<h1 class="logo-text">Soldier Apparel</h1>
<p class="sub-text">Command Center</p>
</header>
<main>
<div class="tab-bar" role="tablist" aria-label="Kategori aplikasi">
<button type="button" class="tab active" id="tab0" role="tab" aria-selected="true" aria-controls="panel0" tabindex="0" onclick="switchTab(0)">Produksi</button>
<button type="button" class="tab" id="tab1" role="tab" aria-selected="false" aria-controls="panel1" tabindex="-1" onclick="switchTab(1)">Admin</button>
</div>
<div id="panels">
<section id="panel0" role="tabpanel" aria-labelledby="tab0">
<h2 class="section-label">Akses Produksi</h2>
<div class="menu-grid">
<button type="button" class="menu-card" onclick="cekPin('1234', 'potong-command.html')"><span class="icon-badge cutting"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#cutting"></use></svg></span><span class="app-title">Divisi Potong</span></button>
<button type="button" class="menu-card" onclick="cekPin('2603', 'jahit-command.html')"><span class="icon-badge sewing"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#sewing"></use></svg></span><span class="app-title">Divisi Jahit</span></button>
<button type="button" class="menu-card" onclick="cekPin('0303', 'qc-command.html')"><span class="icon-badge quality"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#quality"></use></svg></span><span class="app-title">QC &amp; Inspeksi</span></button>
<button type="button" class="menu-card" onclick="cekPin('admin', 'laporan-produksi.html')"><span class="icon-badge production"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#production"></use></svg></span><span class="app-title">Laporan Produksi</span></button>
</div>
</section>
<section id="panel1" role="tabpanel" aria-labelledby="tab1" hidden>
<h2 class="section-label">Akses Admin</h2>
<div class="menu-grid">
<button type="button" class="menu-card" onclick="cekPin('2626', 'stok-bahan-command.html')"><span class="icon-badge materials"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#materials"></use></svg></span><span class="app-title">Stok Bahan</span></button>
<button type="button" class="menu-card gaji-card" onclick="cekPin('8888', 'gaji-harian-command.html')"><span class="icon-badge payroll"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#payroll"></use></svg></span><span class="app-title">Gaji Harian</span></button>
<button type="button" class="menu-card" onclick="cekPin('1111', 'hpp-command-v1.html')"><span class="icon-badge hpp"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#hpp"></use></svg></span><span class="app-title">HPP Produksi</span></button>
<button type="button" class="menu-card" onclick="cekPin('2222', 'pembelian-produk-v1.html')"><span class="icon-badge purchase"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#purchase"></use></svg></span><span class="app-title">Pembelian Produk</span></button>
<button type="button" class="menu-card nota-card" onclick="cekPin('4444', 'nota-penjualan.html')"><span class="icon-badge invoice"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#invoice"></use></svg></span><span class="app-title">Nota Penjualan</span></button>
<button type="button" class="menu-card" onclick="cekPin('3333', 'retur-command.html')"><span class="icon-badge returns"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#returns"></use></svg></span><span class="app-title">Retur Produk</span></button>
</div>
</section>
</div>
</main>
<button type="button" class="refresh-btn" onclick="location.reload()"><svg class="app-icon" aria-hidden="true"><use href="app-icons.svg?v=20260919-classic#refresh"></use></svg>Muat ulang</button>
</div>
<dialog id="pinDialog" class="pin-dialog" aria-labelledby="pinTitle" aria-describedby="pinHelp">
 <form id="pinForm">
  <h2 id="pinTitle">Masuk aplikasi</h2>
  <p id="pinHelp">Masukkan PIN divisi Anda.</p>
  <label for="pinInput">PIN divisi</label>
  <input id="pinInput" type="password" autocomplete="off" required aria-describedby="pinError">
  <p id="pinError" class="pin-error" role="alert" aria-live="polite"></p>
  <div class="pin-actions"><button id="pinCancel" type="button">Batal</button><button class="pin-submit" type="submit">Masuk</button></div>
 </form>
</dialog>
<script>
let pendingPin = null;
const pinDialog = document.getElementById('pinDialog');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');
function cekPin(pinBenar, urlTujuan) {
  const trigger = document.activeElement;
  const title = trigger && trigger.querySelector('.app-title');
  pendingPin = {pin:pinBenar, url:urlTujuan, trigger:trigger};
  document.getElementById('pinTitle').textContent = title ? title.textContent : 'Laporan Produksi';
  pinInput.value = ''; pinInput.removeAttribute('aria-invalid'); pinError.textContent = '';
  pinInput.inputMode = /^\d+$/.test(pinBenar) ? 'numeric' : 'text';
  pinDialog.showModal();
  pinInput.focus();
}
document.getElementById('pinForm').addEventListener('submit', function(event){
 event.preventDefault();
 if(!pendingPin)return;
 if(pinInput.value===pendingPin.pin){ const url=pendingPin.url;pinDialog.close();window.location.href=url;return; }
 pinError.textContent='PIN belum sesuai. Silakan coba lagi.';
 pinInput.setAttribute('aria-invalid','true');pinInput.select();pinInput.focus();
});
document.getElementById('pinCancel').addEventListener('click', function(){pinDialog.close();});
pinDialog.addEventListener('close', function(){
 const trigger=pendingPin && pendingPin.trigger;pendingPin=null;pinInput.value='';pinError.textContent='';
 if(trigger && trigger.isConnected)trigger.focus();
});
</script>

<script>
let currentTab = 0;
function switchTab(idx) {
 if (idx !== 0 && idx !== 1) return;
 currentTab = idx;
 for(let i=0;i<2;i++){
  const tab=document.getElementById('tab'+i);
  tab.classList.toggle('active',i===idx);
  tab.setAttribute('aria-selected',String(i===idx));
  tab.tabIndex=i===idx?0:-1;
  document.getElementById('panel'+i).hidden=i!==idx;
 }
}
for(let i=0;i<2;i++){
 document.getElementById('tab'+i).addEventListener('keydown',function(event){
  let next;
  if(event.key==='ArrowRight'||event.key==='ArrowLeft')next=1-i;
  else if(event.key==='Home')next=0;
  else if(event.key==='End')next=1;
  else return;
  event.preventDefault();switchTab(next);document.getElementById('tab'+next).focus();
 });
}
</script>
</body>
</html>
