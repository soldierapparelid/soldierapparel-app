<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f1110">
    <title>Dashboard Soldier Apparel</title>
    <link rel="manifest" href="manifest.json?v=5">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background-color: #0f1110; 
            background-image: radial-gradient(circle at 50% 0%, #1f2620 0%, #0f1110 60%);
            color: #eef2f7; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- LOGO WATERMARK DI BACKGROUND --- */
        .bg-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            /* Pastikan file gambar elangnya udah bernama logo.png di GitHub */
            background-image: url('logo.png'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 85%; /* Ukuran logo raksasa di background */
            max-width: 600px;
            opacity: 0.10; /* Transparansi 10% biar elegan & kayak watermark rahasia */
            z-index: 0; /* Taruh di paling belakang */
            pointer-events: none; /* Biar layar tetep bisa diklik */
        }

        /* Biar konten tombol tetep muncul di depan watermark */
        .header-container, .menu-grid, .refresh-btn {
            position: relative;
            z-index: 1;
        }

        .header-container {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* --- LOGO EMBLEM KECIL DI ATAS JUDUL --- */
        .header-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 12px;
            border-radius: 50%; /* Bikin logonya berbentuk lingkaran/emblem */
            object-fit: cover;
            border: 2px solid #2a302a;
            box-shadow: 0 0 20px rgba(163, 192, 119, 0.15);
        }

        .logo-text {
            color: #a3c077;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(163, 192, 119, 0.2);
            margin-bottom: 8px;
        }
        .sub-text {
            color: #6b7280;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 480px;
        }
        .menu-card {
            background: rgba(25, 28, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(163, 192, 119, 0.15);
            border-radius: 20px;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .menu-card:hover, .menu-card:active {
            background: rgba(32, 37, 32, 0.95);
            border-color: rgba(163, 192, 119, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(163, 192, 119, 0.15);
        }
        .icon {
            font-size: 34px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            margin-bottom: 4px;
            transition: transform 0.3s ease;
        }
        .menu-card:hover .icon {
            transform: scale(1.1);
        }
        .title {
            font-size: 13px;
            font-weight: 800;
            color: #d1d5db;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .menu-card:hover .title {
            color: #ffffff;
        }
        .refresh-btn {
            margin-top: 50px;
            padding: 12px 24px;
            background: rgba(25, 28, 25, 0.8);
            backdrop-filter: blur(5px);
            color: #6b7280;
            border: 1px solid #374151;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover {
            background: #1f2937;
            color: #f3f4f6;
            border-color: #4b5563;
        }
        @media (max-width: 380px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- ELEMEN BACKGROUND WATERMARK -->
    <div class="bg-watermark"></div>

    <div class="header-container">
        <!-- LOGO LENCANA DI ATAS JUDUL -->
        <img src="logo.png" alt="Logo Soldier Apparel" class="header-logo">
        <div class="logo-text">Soldier Apparel</div>
        <div class="sub-text">Command Center</div>
    </div>

    <div class="menu-grid">
        <div class="menu-card" onclick="cekPin('1234', 'potong-command.html')">
            <div class="icon">✂️</div>
            <div class="title">Divisi Potong</div>
        </div>
        <div class="menu-card" onclick="cekPin('2603', 'jahit-command.html')">
            <div class="icon">🧵</div>
            <div class="title">Divisi Jahit</div>
        </div>
        <div class="menu-card" onclick="cekPin('0303', 'qc-command.html')">
            <div class="icon">🔍</div>
            <div class="title">QC & Inspeksi</div>
        </div>
        <div class="menu-card" onclick="cekPin('admin', 'laporan-produksi.html')">
            <div class="icon">📊</div>
            <div class="title">Lap Produksi</div>
        </div>
        <div class="menu-card" onclick="cekPin('2626', 'stok-bahan-command.html')">
            <div class="icon">📦</div>
            <div class="title">Stok Bahan</div>
        </div>
        <!-- Tombol Gaji Harian dibikin sedikit nyala -->
        <div class="menu-card" style="border-color: rgba(163, 192, 119, 0.4);" onclick="cekPin('8888', 'gaji-harian-command.html')">
            <div class="icon">💸</div>
            <div class="title" style="color: #a3c077;">Gaji Harian</div>
        </div>
    </div>

    <button class="refresh-btn" onclick="location.reload()">
        <span>🔄</span> Refresh Sistem
    </button>

    <script>
        function cekPin(pinBenar, urlTujuan) {
            let inputPin = prompt("Masukkan PIN Komando:");
            if (inputPin === pinBenar) {
                window.location.href = urlTujuan;
            } else if (inputPin !== null) {
                alert("⚠️ AKSES DITOLAK! PIN Tidak Valid.");
            }
        }
    </script>
</body>
</html>
